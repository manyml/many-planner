<html lang="pt-BR">
<head>
  <link rel="icon" href="icone.png?v=m">
  <link rel="apple-touch-icon" href="icone.png?v=m">
  <meta name="theme-color" content="#090a13">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Many Planner</title>
  <script>
    // Detector: mostra na tela qualquer erro de carregamento (inclusive de sintaxe) antes do app subir
    window.__mpErros = [];
    window.addEventListener('error', function (ev) {
      window.__mpErros.push(ev.message + ' @' + (ev.lineno || '?') + ':' + (ev.colno || '?'));
      var d = document.getElementById('mp-diag');
      if (!d) { d = document.createElement('pre'); d.id = 'mp-diag'; d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;white-space:pre-wrap;background:#300;color:#fdd;padding:10px;border-radius:8px;font:12px monospace'; (document.body || document.documentElement).appendChild(d); }
      d.textContent = 'Erro no Many Planner: ' + window.__mpErros.join(' | ');
    });
    setTimeout(function () {
      if (!document.querySelector('#app *') && !window.__mpErros.length) {
        var d = document.createElement('pre');
        d.style.cssText = 'color:#fdd;padding:16px;font:13px monospace;white-space:pre-wrap';
        d.textContent = 'Many Planner: o script principal não iniciou. google.script disponível: ' + (typeof google !== 'undefined' && !!google.script);
        document.body.appendChild(d);
      }
    }, 6000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a13; --surface: #11132a; --surface2: #181b36; --line: #262a4a; --line2: #333862;
  --text: #eceeff; --muted: #8d92bd; --faint: #5d6290;
  --a1: #17d8c8; --a2: #1fa3e6; --a3: #4b3bd8;
  --grad: linear-gradient(120deg, #17d8c8 0%, #1fa3e6 50%, #4b3bd8 100%);
  --ok: #3ee08f; --warn: #ffb547; --danger: #ff5a7a;
  --r: 14px; --r-sm: 10px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 'Outfit', system-ui, sans-serif; }
body { min-height: 100vh; }
a { color: var(--a1); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
::selection { background: rgba(31, 163, 230, .35); }

/* ---------- estrutura ---------- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 18px 14px; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, #0d0f22, var(--bg)); display: flex; flex-direction: column; gap: 4px; }
.side .logo { display: block; width: 150px; margin: 4px auto 18px; filter: drop-shadow(0 4px 18px rgba(31, 163, 230, .35)); }
.nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; text-align: left; }
.nav-btn:hover { background: var(--surface); color: var(--text); }
.nav-btn.on { background: var(--surface2); color: var(--text); box-shadow: inset 3px 0 0 var(--a1); }
.nav-btn svg { width: 19px; height: 19px; flex: none; }
.side .sep { height: 1px; background: var(--line); margin: 10px 4px; }
.side .me { margin-top: auto; padding: 10px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.side .me b { display: block; color: var(--text); font-weight: 600; }
.side .me .me-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.side .me .me-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { flex: none; display: inline-grid; place-items: center; border-radius: 50%; object-fit: cover; color: #fff; font-weight: 700; line-height: 1;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px color-mix(in srgb, var(--a1) 55%, transparent); }
.avatar.clicavel { cursor: pointer; transition: transform .2s; }
.avatar.clicavel:hover { transform: scale(1.08); }
.festa-logo { height: 120px; margin: 12px 0 4px; background: center / contain no-repeat; filter: drop-shadow(0 4px 14px rgba(0,0,0,.35)); }
.vrcx-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.vrcx-stat { background: var(--surface2, rgba(255,255,255,.04)); border-radius: 12px; padding: 10px 12px; }
.vrcx-stat b { display: block; font-size: 24px; line-height: 1.1; }
.vrcx-stat span { font-size: 12px; color: var(--muted); }
.li.click { cursor: pointer; }
.li.click:hover { background: color-mix(in srgb, var(--a1) 8%, transparent); }
@media (max-width: 700px) { .vrcx-nums { display: none; } }
.vrcx-graf { position: relative; }
.vrcx-graf rect { transition: opacity .15s, filter .15s; }
.vrcx-graf:hover rect { opacity: .55; }
.vrcx-graf:hover rect.on { opacity: 1; filter: brightness(1.25) drop-shadow(0 0 6px var(--a1)); }
.graf-dica { display: none; position: absolute; pointer-events: none; z-index: 5; white-space: nowrap; padding: 7px 10px; border-radius: 10px;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--a1) 45%, transparent); box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 12px; }
.graf-dica b { display: block; font-size: 13px; color: var(--text); }
.graf-dica span { display: block; color: var(--muted); }
.tabela-noites-wrap { overflow-x: auto; margin: 0 -4px; }
.tabela-noites { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
.tabela-noites th { text-align: right; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.08); white-space: nowrap; }
.tabela-noites th:first-child { text-align: left; }
.tabela-noites th.ord { cursor: pointer; user-select: none; transition: color .15s; }
.tabela-noites th.ord:hover, .tabela-noites th.on { color: var(--text); }
.tabela-noites th.on { color: var(--a1); }
.tabela-noites th.insta.on { color: #ff4fb8; }
.th-in { display: inline-flex; align-items: center; gap: 5px; }
.th-in svg { width: 14px; height: 14px; }
.th-in .seta { font-size: 10px; opacity: .6; }
.tabela-noites th.on .seta { opacity: 1; }
.tabela-noites td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; }
.tabela-noites tbody tr { cursor: pointer; transition: background .15s; }
.tabela-noites tbody tr:hover { background: color-mix(in srgb, var(--a1) 7%, transparent); }
.tabela-noites td.festa b { display: block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabela-noites td.festa span { font-size: 12px; color: var(--muted); }
.tabela-noites td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tabela-noites td.num b { display: block; font-size: 15px; }
.mini-barra { display: block; height: 3px; width: 64px; margin: 4px 0 0 auto; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
.mini-barra i { display: block; height: 100%; background: var(--a1); border-radius: 3px; }
.tabela-noites td.insta .mini-barra i { background: #ff4fb8; }
.tabela-noites .anotar { font-size: 12px; color: #ff4fb8; }
.tabela-noites td.acoes { white-space: nowrap; text-align: right; width: 1%; }
.graf-legenda { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.graf-legenda span::before { content: ''; display: inline-block; width: 12px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; background: var(--a1); }
.graf-legenda .l-insta::before { height: 3px; vertical-align: 3px; background: #ff4fb8; }
.vrcx-graf svg { width: 100%; height: auto; max-height: 180px; display: block; }
.pessoa-chip { display: inline-flex; align-items: center; gap: 6px; }
.shell > * { min-width: 0; }
.main { min-width: 0; padding: 26px 34px 90px; max-width: 1180px; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 200px; }
.top .back { border: 0; background: var(--surface); color: var(--muted); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; }
.mob-bar { display: none; }

/* ---------- componentes ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: var(--r-sm);
  border: 1px solid var(--line2); background: var(--surface2); color: var(--text); font-weight: 600; cursor: pointer;
  white-space: nowrap; text-decoration: none; font-size: 14px; }
.btn:hover { border-color: var(--a2); }
.btn.primary { border: 0; background: var(--grad); color: #04121a; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.card.click { cursor: pointer; transition: border-color .15s, transform .15s; }
.card.click:hover { border-color: var(--a2); transform: translateY(-1px); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.cols2 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--surface2); border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.x { cursor: pointer; }
.chip.x:hover { border-color: var(--danger); color: var(--danger); }
.chip.on { background: rgba(23, 216, 200, .12); border-color: rgba(23, 216, 200, .45); color: var(--a1); }
.st-Ideia { color: #b9a5ff; border-color: #4a3b8f; }
.st-Planejando { color: #7cc8ff; border-color: #24547a; }
.st-Confirmada { color: var(--a1); border-color: #136d66; }
.st-Divulgada { color: #ffd36b; border-color: #7a5f1c; }
.st-Realizada { color: var(--ok); border-color: #1d6b45; }
.st-Cancelada { color: var(--danger); border-color: #7a2438; }
.st-Sugerido { color: #b9a5ff; border-color: #4a3b8f; }
.st-Testando { color: #ffd36b; border-color: #7a5f1c; }
.st-Aprovado { color: var(--ok); border-color: #1d6b45; }
.st-Reprovado { color: var(--danger); border-color: #7a2438; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tab { padding: 10px 14px; border: 0; background: none; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text); border-image: var(--grad) 1; border-bottom-width: 2px; border-bottom-style: solid; }
.tab .n { margin-left: 5px; font-size: 11px; color: var(--faint); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); border: 1px dashed var(--line2); border-radius: var(--r); }
.empty b { display: block; color: var(--text); margin-bottom: 4px; font-size: 16px; }
.bar { height: 6px; background: var(--surface2); border-radius: 9px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--grad); border-radius: 9px; }

.cbar { display: flex; gap: 4px; height: 8px; }
.cbar.grande { height: 14px; gap: 6px; }
.cbar .seg { position: relative; min-width: 14px; border-radius: 9px; background: color-mix(in srgb, var(--cor) 16%, var(--surface2)); overflow: hidden; }
.cbar .seg > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; background-color: var(--cor); transition: width .8s cubic-bezier(.22,1,.36,1); }
.cbar .seg.vazio { animation: cb-respira 2.6s ease-in-out infinite; }
.cbar .seg.andamento > i { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 7px, transparent 7px 14px); background-size: 19.8px 19.8px; animation: cb-listras .9s linear infinite; }
.cbar .seg.completo > i { box-shadow: 0 0 14px var(--cor); animation: cb-brilho 2.2s ease-in-out infinite; }
.cbar .seg.completo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.65) 50%, transparent 70%); transform: translateX(-120%); animation: cb-varre 2.8s ease-in-out infinite; }
@keyframes cb-respira { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
@keyframes cb-listras { to { background-position: 19.8px 0; } }
@keyframes cb-brilho { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
@keyframes cb-varre { 0% { transform: translateX(-120%); } 60%, 100% { transform: translateX(120%); } }
.cbar-grade { display: grid; column-gap: 6px; row-gap: 10px; align-items: center; }
.cbar-grade .cbar { min-width: 0; }
.cleg-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; padding-right: 10px; }
.cleg-item b { color: var(--text); font-weight: 600; }
.cleg-item svg { width: 15px; height: 15px; color: var(--cor); flex: none; }
.cleg-item.completo { color: var(--cor); }
.cleg-item.completo svg { animation: cb-pula 1.6s ease-in-out infinite; }
.cleg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; }
.cleg span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.cleg span b { color: var(--text); font-weight: 600; }
.cleg svg { width: 15px; height: 15px; color: var(--cor); }
.cleg span.completo { color: var(--cor); }
.cleg span.completo svg { animation: cb-pula 1.6s ease-in-out infinite; }
.cat { border-top: 3px solid var(--cor); }
.cat-head { display: flex; align-items: center; gap: 12px; }
.cat-ico { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; color: var(--cor); background: color-mix(in srgb, var(--cor) 18%, transparent); }
.cat-ico svg { width: 20px; height: 20px; }
.cat.andamento .cat-ico { animation: cb-gira-leve 3s ease-in-out infinite; }
.cat.completo .cat-ico { background: var(--cor); color: #08121a; box-shadow: 0 0 18px color-mix(in srgb, var(--cor) 60%, transparent); animation: cb-pula 1.6s ease-in-out infinite; }
.cat.vazio .cat-ico { opacity: .75; }
.cat-num { font-weight: 800; font-size: 20px; color: var(--cor); }
@keyframes cb-pula { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-3px) scale(1.08); } }
@keyframes cb-gira-leve { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.tarefa .t-ico { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--cor, var(--a1)); background: color-mix(in srgb, var(--cor, #17d8c8) 12%, transparent); }
.tarefa .t-ico svg { width: 16px; height: 16px; }
.tarefa.feita .t-ico { opacity: .55; }
.tarefa.feita input[type=checkbox] { animation: cb-marca .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes cb-marca { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.auto-chip { display: inline-flex; align-items: center; gap: 4px; color: var(--cor, var(--a1)); }
.auto-chip svg { width: 12px; height: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .15); }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .t { flex: 1; min-width: 0; }
.li .t .s { font-size: 12px; color: var(--muted); }
.late { color: var(--danger) !important; }
.soon { color: var(--warn) !important; }
.done { text-decoration: line-through; color: var(--faint); }
.section-title { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.section-title:first-child { margin-top: 0; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ---------- formulários ---------- */
.form { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.in, select.in, textarea.in { width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line2);
  background: #0c0e1f; color: var(--text); outline: none; font-size: 15px; }
.in:focus { border-color: var(--a2); box-shadow: 0 0 0 3px rgba(31, 163, 230, .18); }
textarea.in { min-height: 84px; resize: vertical; }
input[type=color].in { padding: 3px; height: 40px; width: 52px; cursor: pointer; }
input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--a1); cursor: pointer; }
.hint { font-size: 12px; color: var(--faint); }
.tagbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: #0c0e1f; min-height: 44px; }
.tagbox input { flex: 1; min-width: 110px; border: 0; background: none; outline: none; padding: 4px; font-size: 15px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 0 1px; cursor: pointer; font-size: 19px; color: var(--line2); line-height: 1; }
.stars button.on { color: var(--warn); }

/* ---------- festa ---------- */
.festa-card .date { display: flex; align-items: baseline; gap: 8px; }
.festa-card .date b { font-size: 28px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.festa-card h4 { margin: 6px 0 8px; font-size: 18px; }
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 24px; border: 1px solid var(--line2);
  background: radial-gradient(120% 140% at 100% 0%, rgba(75, 59, 216, .45), transparent 60%), radial-gradient(90% 120% at 0% 100%, rgba(23, 216, 200, .22), transparent 60%), var(--surface); }
.hero .hero-logo { position: absolute; right: 2%; top: 50%; height: 118%; aspect-ratio: 1; translate: 0 -50%; pointer-events: none;
  background: center / contain no-repeat; opacity: .16; filter: saturate(1.1);
  -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%); mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
  animation: hero-logo-flutua 14s ease-in-out infinite alternate; }
.hero.com-logo > :not(.hero-logo) { position: relative; z-index: 1; }
@keyframes hero-logo-flutua { from { rotate: -3deg; scale: 1; } to { rotate: 3deg; scale: 1.06; } }
@media (max-width: 700px) { .hero .hero-logo { height: 105%; right: -10%; opacity: .12; } }
.hero .big { font-size: 30px; font-weight: 800; line-height: 1.1; margin: 4px 0 8px; }
.hero .count { font-size: 46px; font-weight: 800; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.time-pair { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.time-pair .pt { color: var(--muted); font-weight: 500; }

/* ---------- mapas / mídia ---------- */
.mapa { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.mapa .img { aspect-ratio: 4 / 3; background: var(--surface2) center / cover no-repeat; position: relative; }
.mapa .img .badges { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.mapa .img .badges .chip { background: rgba(9, 10, 19, .78); backdrop-filter: blur(4px); }
.mapa .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.mapa .nome { font-weight: 700; line-height: 1.25; }
.mapa .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.mapa .tags span { font-size: 11px; color: var(--faint); }
.mapa .acts { margin-top: auto; padding-top: 6px; }
.thumb { width: 100%; aspect-ratio: 1; border-radius: var(--r-sm); background: #0c0e1f center / contain no-repeat;
  border: 1px solid var(--line); position: relative; }
.thumb.checker { background-color: #0c0e1f; background-image: linear-gradient(45deg, #15172b 25%, transparent 25%), linear-gradient(-45deg, #15172b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #15172b 75%), linear-gradient(-45deg, transparent 75%, #15172b 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.thumb .lbl { position: absolute; left: 6px; bottom: 6px; right: 6px; font-size: 11px; background: rgba(9, 10, 19, .8); padding: 3px 6px; border-radius: 6px; }
.thumb .rm { position: absolute; right: 4px; top: 4px; }
.files { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.dj-avatar { width: 64px; height: 64px; border-radius: 16px; flex: none; background: var(--surface2) center / cover no-repeat; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: var(--muted); border: 1px solid var(--line2); }
.dj-avatar.logo { background-size: contain; background-color: #0c0e1f; }

/* ---------- modal / toast / carregando ---------- */
.overlay { position: fixed; inset: 0; background: rgba(4, 5, 12, .72); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center;
  padding: 6vh 16px; z-index: 50; overflow-y: auto; }
.modal { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--shadow); }
.modal.wide { max-width: 900px; }
.modal header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal header h2 { margin: 0; font-size: 18px; flex: 1; }
.modal .body { padding: 20px; }
.modal footer { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { padding: 11px 16px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line2); box-shadow: var(--shadow); max-width: 360px; animation: up .2s; }
.toast.err { border-color: var(--danger); }
.toast.ok { border-color: #1d6b45; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--a1); animation: rot .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes rot { to { transform: rotate(360deg); } }
.loading { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 40px; color: var(--muted); }
.splash { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
.splash img { width: 220px; }
.logo-anim { position: relative; width: 220px; animation: logo-entra .9s cubic-bezier(.22, 1, .36, 1) both, logo-respira 2.6s ease-in-out .9s infinite; }
.logo-anim img { display: block; width: 100%; }
.logo-brilho { position: absolute; inset: 0; pointer-events: none; mask-size: 100% 100%; -webkit-mask-size: 100% 100%; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;
  background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .85) 50%, transparent 62%); background-size: 260% 100%; animation: logo-brilho 2.2s ease-in-out .5s infinite; }
.splash.carregando .loading { padding-top: 18px; animation: logo-texto 1.6s ease-in-out infinite; }
@keyframes logo-entra { from { opacity: 0; scale: .7; filter: blur(10px); } to { opacity: 1; scale: 1; filter: blur(0); } }
@keyframes logo-respira {

  33% { filter: drop-shadow(0 6px 26px rgba(31, 163, 230, .55)); }

  66% { filter: drop-shadow(0 6px 30px rgba(75, 59, 216, .6)); } }
@keyframes logo-brilho { from { background-position: 130% 0; } to { background-position: -30% 0; } }

  .modal { border-radius: 0; min-height: 100%; border: 0; }

  .li.tarefa { flex-wrap: wrap; }

  .top .back { flex: none; }

}

<body>
  <div id="app"></div>
<script>
  // Ponte: a interface chama google.script.run.rpc(...) como no Apps Script; aqui isso vira um POST à API.
  // credentials: 'omit' faz a chamada sem as contas Google do navegador (é isso que evita o erro de várias contas).
  var MANY_API = "https://script.google.com/macros/s/AKfycbxEC6pKeKqWBMHv2wTjvSf53r_ycV4BRs4yvTr1IEWDNs40I0o9ewgbeVKhWihRAnlF/exec";
  (function () {
    function runner(ok, fail) {
      return {
        withSuccessHandler: function (f) { return runner(f, fail); },
        withFailureHandler: function (f) { return runner(ok, f); },
        rpc: function (acao, argsJson, token) {
          fetch(MANY_API, {
            method: 'POST', credentials: 'omit', redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ acao: acao, args: JSON.parse(argsJson || '{}'), token: token || '' })
          }).then(function (r) {
            if (!r.ok) throw new Error('O servidor respondeu ' + r.status);
            return r.text();
          }).then(function (t) { if (ok) ok(t); }).catch(function (e) { if (fail) fail(e); });
        }
      };
    }

// caixa de tags: Enter ou vírgula adiciona
function tagBox(valores, placeholder) {
  const vals = (valores || []).slice();
  const box = h('div', { class: 'tagbox' });
  const input = h('input', { placeholder: placeholder || 'digite e Enter' });
  function desenhar() {
    box.innerHTML = '';
    vals.forEach((v, i) => box.appendChild(h('span', { class: 'chip x', title: 'remover', onclick: () => { vals.splice(i, 1); desenhar(); } }, v, ' ×')));
    box.appendChild(input);
  }
  function adicionar() {
    input.value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean).forEach((x) => { if (!vals.includes(x)) vals.push(x); });
    input.value = ''; desenhar(); input.focus();
  }
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); adicionar(); }
    if (e.key === 'Backspace' && !input.value && vals.length) { vals.pop(); desenhar(); input.focus(); }
  });
  input.addEventListener('blur', () => { if (input.value.trim()) adicionar(); });
  desenhar();
  box.valores = () => { if (input.value.trim()) adicionar(); return vals.slice(); };
  box.definir = (lista) => { vals.splice(0, vals.length, ...lista); desenhar(); };
  return box;
}

// miniaturas de arquivos do Drive (carregadas sob demanda): pedidas em lotes e guardadas neste navegador (IndexedDB)
const thumbCache = {};
const thumbEspera = {};
let thumbLote = [], tThumb = 0;
let thumbDb = null;
function abrirThumbDb() {
  if (!thumbDb) {
    thumbDb = new Promise((res) => {
      try {
        const r = indexedDB.open('mp_miniaturas', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('m');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  return thumbDb;
}
function thumbDbGet(id) {
  return abrirThumbDb().then((db) => new Promise((res) => {
    if (!db) return res(undefined);
    try { const q = db.transaction('m').objectStore('m').get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); }
  }));
}
function thumbDbPut(id, v) {
  abrirThumbDb().then((db) => { try { if (db && v) db.transaction('m', 'readwrite').objectStore('m').put(v, id); } catch (e) { } });
}
// lotes de 4 miniaturas, no máximo 4 chamadas ao mesmo tempo; o que a tela pede passa na frente da pré-carga
const filaLotes = [];
let lotesAtivos = 0;
function entregarThumb(id, u) {
  thumbCache[id] = u; thumbDbPut(id, u);
  (thumbEspera[id] || []).forEach((f) => f(u)); delete thumbEspera[id];
}
function rodarLotes() {
  while (lotesAtivos < 4 && filaLotes.length) {
    const parte = filaLotes.shift();
    lotesAtivos++;
    api('miniaturas', { fileIds: parte }).then((r) => parte.forEach((id) => entregarThumb(id, r[id] || null)))
      .catch(() => parte.forEach((id) => { thumbCache[id] = null; delete thumbEspera[id]; }))
      .finally(() => { lotesAtivos--; rodarLotes(); });
  }
}
function enfileirarThumbs(ids, naFrente) {
  const lotes = [];
  for (let i = 0; i < ids.length; i += 4) lotes.push(ids.slice(i, i + 4));
  if (naFrente) filaLotes.unshift(...lotes); else filaLotes.push(...lotes);
  rodarLotes();
}
function pedirLoteThumbs() { enfileirarThumbs(thumbLote.splice(0), true); }
function miniatura(fileId, aplicar) {
  if (!fileId) return;
  if (thumbCache[fileId] !== undefined) { aplicar(thumbCache[fileId]); return; }
  if (thumbEspera[fileId]) {
    thumbEspera[fileId].push(aplicar);
    // estava só na pré-carga, esperando a vez: a tela precisa agora, então o lote vai para a frente
    const i = filaLotes.findIndex((l) => l.includes(fileId));
    if (i > 0) filaLotes.unshift(filaLotes.splice(i, 1)[0]);
    return;
  }
  thumbEspera[fileId] = [aplicar];
  thumbDbGet(fileId).then((v) => {
    if (v) { thumbCache[fileId] = v; (thumbEspera[fileId] || []).forEach((f) => f(v)); delete thumbEspera[fileId]; return; }
    thumbLote.push(fileId);
    clearTimeout(tThumb); tThumb = setTimeout(pedirLoteThumbs, 20);
  });
}
// Pré-carga: depois de abrir, baixa por trás as imagens principais (logos das festas, DJs, artes e fundos das próximas festas)
// e guarda no navegador; nas próximas vezes elas já aparecem na hora.
function idsParaPreCarregar() {
  const ids = [], add_ = (x) => { if (x && x.fileId) ids.push(x.fileId); };
  const fs = festasOrdenadas(), prox = fs.filter((f) => f.data >= S.hoje && f.status !== 'Cancelada'), outras = fs.filter((f) => !prox.includes(f)).reverse();
  prox.concat(outras).forEach((f) => add_(arteDe(f).logo));
  lista('djs').forEach((d) => { const a = d.artes || []; add_(a.find((x) => x.tipo === 'logo') || a.find((x) => x.tipo === 'foto') || a[0]); });
  prox.forEach((f) => {
    const A = arteDe(f);
    Object.values(A.fundos).forEach(add_);
    const arts = artesDa(f.id);
    [...new Set(arts.map((x) => x.nome))].forEach((n) => add_(arts.filter((x) => x.nome === n).sort((a, b) => b.versao - a.versao)[0]));
  });
  lista('djs').forEach((d) => (d.artes || []).forEach(add_));
  return [...new Set(ids)];
}
async function preCarregarImagens() {
  const db = await abrirThumbDb();
  const salvas = await new Promise((res) => {
    if (!db) return res(new Set());
    try { const q = db.transaction('m').objectStore('m').getAllKeys(); q.onsuccess = () => res(new Set(q.result)); q.onerror = () => res(new Set()); } catch (e) { res(new Set()); }
  });
  const faltam = idsParaPreCarregar().filter((id) => !salvas.has(id) && thumbCache[id] === undefined && !thumbEspera[id]);
  faltam.forEach((id) => { thumbEspera[id] = []; });
  enfileirarThumbs(faltam, false);
}
function agendarPreCarga() { setTimeout(() => { preCarregarImagens().catch(() => { }); }, 1500); }
function thumbDrive(fileId, cls, label) {
  const el = h('div', { class: 'thumb ' + (cls || '') }, label ? h('span', { class: 'lbl' }, label) : null);
  // no xadrez (PNG transparente) a imagem vai num <img> por cima, para não brigar com o padrão do fundo

    if (!src) return;
    if (/checker/.test(cls || '')) el.insertBefore(h('img', { src, style: { position: 'absolute', inset: '6px', width: 'calc(100% - 12px)', height: 'calc(100% - 12px)', objectFit: 'contain' } }), el.firstChild);
    else el.style.backgroundImage = `url("${src}")`;

}
function bgDrive(el, fileId) {

}

function escolherArquivo(accept) {
  return new Promise((res) => {
    const i = h('input', { type: 'file', accept: accept || TIPO_IMAGEM, style: { display: 'none' } });

function lerBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function enviar(alvo, id, tipo) {

  toast('Enviando ' + f.name + '…');
  const base64 = await lerBase64(f);

function festasOrdenadas() { return lista('festas').slice().sort((a, b) => (a.data < b.data ? -1 : 1)); }
function proximaFesta() { return festasOrdenadas().find((f) => f.data >= S.hoje && f.status !== 'Cancelada') || null; }
// ---------- Checklist: categorias, ícones e marcação automática ----------
const CATEGORIAS_TAREFA = [
  { k: 'planejamento', nome: 'Planejamento', icone: 'prancheta', cor: '#17d8c8' },
  { k: 'divulgacao', nome: 'Divulgação', icone: 'megafone', cor: '#ff4fb8' },
  { k: 'acao', nome: 'Ação', icone: 'raio', cor: '#ffc94d' }
];
function categoriaDe(t) {
  if (CATEGORIAS_TAREFA.some((c) => c.k === t.categoria)) return t.categoria;
  const x = String(t.titulo || '').toLowerCase();
  if (/reuni|m[eé]tric|avalia/.test(x)) return 'acao';
  if (/^artes?\b|montar artes|publicar|an[uú]ncio|criar evento|lembrete|^story|contagem|divulg/.test(x)) return 'divulgacao';
  return 'planejamento';
}
function corCategoria(k) { return (CATEGORIAS_TAREFA.find((c) => c.k === k) || CATEGORIAS_TAREFA[0]).cor; }
function iconeTarefa(t) {
  const x = String(t.titulo || '').toLowerCase();
  const regras = [[/reuni/, 'equipe'], [/m[eé]tric|avalia/, 'grafico'], [/tema/, 'temas'], [/mapa/, 'mapas'], [/atividade/, 'estrela'],
    [/escala/, 'equipe'], [/^artes?\b|montar artes/, 'imagem'], [/publicar|an[uú]ncio/, 'megafone'], [/evento/, 'festas'],
    [/story|lembrete|contagem/, 'celular'], [/dj/, 'djs']];
  const r = regras.find(([re]) => re.test(x));
  return r ? r[1] : 'check';
}
// motivo para a tarefa contar como feita sozinha ('' = não)
function autoMotivo(t, f) {
  if (!f) return '';
  const x = String(t.titulo || '').toLowerCase();
  const metricas = /m[eé]tric/.test(x);
  if (f.data && f.data < S.hoje && !metricas) return 'a data da festa já passou';
  if (/tema/.test(x) && ['Confirmada', 'Divulgada', 'Realizada'].includes(f.status)) return 'festa confirmada';
  if (/(buscar|testar|escolher).*mapa/.test(x) && f.mapaId) return 'mapa escolhido';
  if (/atividade/.test(x) && lista('atividades').some((a) => a.festaId === f.id)) return 'atividade cadastrada';
  if (/escala/.test(x)) {
    const funcoes = lista('funcoes'), esc = lista('escala').filter((e) => e.festaId === f.id && e.pessoa);
    if (funcoes.length && funcoes.every((fn) => esc.some((e) => e.funcaoId === fn.id))) return 'todas as funções preenchidas';
  }
  if (/^artes?\b|montar artes/.test(x) && artesAprovadas(f.id).completo) return 'artes aprovadas';
  return '';
}
// artes aprovadas por TIPO de peça (story, feed, banner, contagens, DJs, carrossel): basta uma aprovada de cada tipo
function artesAprovadas(fid) {
  const arts = artesDa(fid);
  const tipos = [...new Set(arts.map((a) => a.peca))];
  const ok = tipos.filter((t) => arts.some((a) => a.peca === t && a.status === 'Aprovada'));
  return { tipos: tipos.length, aprovados: ok.length, completo: tipos.length > 0 && ok.length === tipos.length };
}
function comAuto(t, f) {
  if (t.feita) return t;
  const m = autoMotivo(t, f);
  return m ? Object.assign({}, t, { feita: true, auto: m }) : t;

function editarAtividade(f, a) {

  const tipos = lista('atividadeTipos').slice().sort((x, y) => x.nome.localeCompare(y.nome));
  const tipo = sel([['', '— tipo —']].concat(tipos.map((t) => [t.id, t.nome])).concat([['__novo', '+ criar novo tipo…']]), a.tipoId || '');
  const novoTipo = inp({ placeholder: 'Nome do novo tipo', style: { display: 'none' } });

  const regras = area(a.regras, { placeholder: 'Como participar, critérios, onde enviar…' });
  const premios = area((a.premios || []).join('\n'), { placeholder: '1º lugar: 20€\n2º lugar: VRC+', style: { minHeight: '70px' } });
  const prazo = inp({ type: 'date', value: a.prazo || '' });
  const canal = inp({ value: a.canal || '', placeholder: '#concursos no Discord' });
  const paginas = seletorPaginas(a.paginas);

  // trocar o tipo carrega os padrões dele; só sobrescreve o que está vazio ou ainda igual ao padrão do tipo anterior
  const padraoDe = (t) => ({ titulo: (t && (t.titulo || t.nome)) || '', regras: (t && t.regras) || '', premios: ((t && t.premios) || []).join('\n'), paginas: String((t && Number(t.paginas)) || 0) });

  tipo.addEventListener('change', () => {

    novoTipo.style.display = novo ? '' : 'none';
    salvarPadrao.checked = novo;
    if (novo) { novoTipo.focus(); return; }
    const pad = padraoDe(porId('atividadeTipos', tipo.value));
    [[titulo, 'titulo'], [regras, 'regras'], [premios, 'premios'], [paginas, 'paginas']].forEach(([campoEl, k]) => {
      const atual = campoEl.value.trim();
      if (!atual || atual === anterior[k] || (k === 'paginas' && atual === '0')) campoEl.value = pad[k];
    });
    anterior = pad;

  const m = modal({
    titulo: a.id ? 'Editar atividade' : 'Nova atividade',

// nome da noite: o que a equipe deu > festa do app nessa data > mundo

async function apagarNoite(n) {

// Insta x VRChat: seguidores ganhos entre as festas anotadas, comparados com o público delas
function cruzamentoInsta(noites, stat) {
  const com = noites.filter((n) => seguidoresDe(n) !== null);
  if (!com.length) return h('div', { class: 'hint' }, 'Anote os seguidores do Insta em cada festa (lápis) para cruzar com o público do VRChat.');
  const ult = com[com.length - 1];
  if (com.length < 2) return h('div', { class: 'vrcx-stats' }, stat(fmtNum(seguidoresDe(ult)), 'seguidores no Insta · ' + nomeNoite(ult)));
  const prim = com[0], ganho = seguidoresDe(ult) - seguidoresDe(prim);
  // público somado das festas depois da primeira anotada (é delas que vêm os seguidores ganhos)
  const publico = com.slice(1).reduce((s, n) => s + n.unicos, 0);
  const porFesta = Math.round(ganho / (com.length - 1));
  return h('div', { class: 'vrcx-stats' },
    stat(fmtNum(seguidoresDe(ult)), 'seguidores no Insta · ' + nomeNoite(ult)),
    stat((ganho >= 0 ? '+' : '') + fmtNum(ganho), 'seguidores desde ' + nomeNoite(prim)),
    stat((porFesta >= 0 ? '+' : '') + fmtNum(porFesta), 'seguidores por festa, em média'),
    stat(publico ? (Math.round((ganho / publico) * 1000) / 10).toLocaleString('pt-BR') : '—', 'novos seguidores a cada 100 pessoas no VRChat'));
}

// público (pessoas únicas) de cada festa, em ordem de data
function graficoFestas(noites) {
  if (noites.length < 2) return null;
  const max = Math.max(...noites.map((n) => n.unicos), 1), W = 600, H = 150, bw = W / noites.length;
  const barras = noites.map((n, i) => {
    const alt = Math.max(2, (n.unicos / max) * (H - 34)), x = i * bw;
    return `<rect x="${(x + 3).toFixed(1)}" y="${(H - 16 - alt).toFixed(1)}" width="${Math.max(2, bw - 6).toFixed(1)}" height="${alt.toFixed(1)}" rx="3" fill="var(--a1)" data-i="${i}"></rect>` +
      `<text x="${(x + bw / 2).toFixed(1)}" y="${(H - 20 - alt).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--muted)">${n.unicos}</text>` +
      `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 3}" font-size="9" text-anchor="middle" fill="var(--faint)">${fmtNoite(n.noite).slice(0, 5)}/${n.noite.slice(2, 4)}</text>`;
  }).join('');
  // linha dos seguidores do Insta (escala própria, só nas festas que têm o número anotado)
  const segs = noites.map(seguidoresDe), comSeg = segs.filter((x) => x !== null);
  let linha = '';
  if (comSeg.length) {
    const lo = Math.min(...comSeg), hi = Math.max(...comSeg);
    const y = (v) => (hi === lo ? 40 : 14 + (1 - (v - lo) / (hi - lo)) * (H - 60));
    const pts = segs.map((v, i) => (v === null ? null : [i * bw + bw / 2, y(v)])).filter(Boolean);
    linha = `<polyline points="${pts.map((p) => p.map((c) => c.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#ff4fb8" stroke-width="2.5" stroke-linejoin="round"/>` +
      pts.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#ff4fb8" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
  }
  const box = h('div', { class: 'vrcx-graf' });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${barras}${linha}</svg>`;
  dicaGrafico(box, noites.length, (i) => {
    const n = noites[i], s = segs[i];
    const ant = segs.slice(0, i).filter((x) => x !== null).pop();
    return [nomeNoite(n), `${fmtNoite(n.noite)} · ${n.unicos} pessoas no VRChat · pico ${n.pico ?? '—'}`,
      s !== null ? `${fmtNum(s)} seguidores no Insta${ant !== undefined ? ` (${s - ant >= 0 ? '+' : ''}${fmtNum(s - ant)} desde a anterior)` : ''}` : 'seguidores no Insta: não anotado'];
  }, (i) => ir('metricas', { noite: noites[i].noite }));
  const wrap = h('div', {}, box);
  if (comSeg.length) wrap.appendChild(h('div', { class: 'graf-legenda' }, h('span', { class: 'l-vrc' }, 'pessoas no VRChat'), h('span', { class: 'l-insta' }, 'seguidores no Insta')));
  return wrap;
}

// barras de lotação a cada 15 min, com a hora de Brasília embaixo de hora em hora
function graficoLotacao(serie) {
  if (serie.length < 2) return null;
  const max = Math.max(...serie.map((p) => p.n), 1), W = 600, H = 120, bw = W / serie.length;
  const barras = serie.map((p, i) => {
    const alt = Math.max(1, (p.n / max) * (H - 18));
    const hora = horaBR(p.t);
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - 16 - alt).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${alt.toFixed(1)}" rx="2" fill="${p.n === max ? 'var(--a2)' : 'var(--a1)'}" data-i="${i}"></rect>` +
      (i === 0 || hora.slice(0, 2) !== horaBR(serie[i - 1].t).slice(0, 2) ? `<text x="${(i * bw).toFixed(1)}" y="${H - 3}" font-size="10" fill="var(--faint)">${hora}</text>` : '');
  }).join('');
  const box = h('div', { class: 'vrcx-graf' });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${barras}</svg>`;
  dicaGrafico(box, serie.length, (i) => [horaBR(serie[i].t), `${serie[i].n} pessoas na festa`]);
  return box;
}

// dica que segue o mouse num gráfico de barras: acha a coluna pela posição e destaca a barra
function dicaGrafico(box, total, textos, aoClicar) {
  const dica = h('div', { class: 'graf-dica' });
  box.appendChild(dica);
  let atual = -1;
  // converte a posição do mouse para as coordenadas do próprio desenho (o SVG pode não ocupar a largura toda da caixa)
  const svg = box.querySelector('svg');
  const indice = (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const x = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
    return Math.min(total - 1, Math.max(0, Math.floor((x / svg.viewBox.baseVal.width) * total)));
  };
  box.addEventListener('mousemove', (e) => {
    const i = indice(e), r = box.getBoundingClientRect();
    if (i !== atual) {
      box.querySelectorAll('rect.on').forEach((x) => x.classList.remove('on'));
      const barra = box.querySelector(`rect[data-i="${i}"]`);
      if (barra) barra.classList.add('on');
      const [titulo, ...linhas] = textos(i);
      dica.replaceChildren(h('b', {}, titulo), ...linhas.map((t) => h('span', {}, t)));
      atual = i;
    }
    dica.style.display = 'block';
    const x = e.clientX - r.left, larg = dica.offsetWidth;
    dica.style.left = Math.min(Math.max(0, x - larg / 2), r.width - larg) + 'px';
    dica.style.top = Math.max(0, e.clientY - r.top - dica.offsetHeight - 12) + 'px';
  });
  box.addEventListener('mouseleave', () => { dica.style.display = 'none'; box.querySelectorAll('rect.on').forEach((x) => x.classList.remove('on')); atual = -1; });
  if (aoClicar) { box.style.cursor = 'pointer'; box.addEventListener('click', (e) => aoClicar(indice(e))); }
}

const TIPOS_CAL = ['Feriado', 'Comemorativa', 'Cultura', 'Many'];
const REGIOES = ['Global', 'BR', 'PT', 'BR/PT'];

function descreverRegra(r) {
  const p = String(r || '').split(':');
  if (p[0] === 'fixa') { const [mm, dd] = p[1].split('-'); return `todo ${Number(dd)}/${mm}`; }
  if (p[0] === 'pascoa') { const n = Number(p[1]); return n === 0 ? 'domingo de Páscoa' : `${Math.abs(n)} dias ${n < 0 ? 'antes' : 'depois'} da Páscoa`; }
  if (p[0] === 'nth') return `${p[3] === '-1' ? 'último' : p[3] + 'º'} ${DIAS_L[Number(p[2])]} de ${MESES_L[Number(p[1]) - 1]}`;
  if (p[0] === 'data') return `só em ${fmtData(p[1])} ${p[1].slice(0, 4)}`;
  if (p[0] === 'sexta13') return 'toda sexta-feira 13';
  return r;
}

function temasCalendario() {

function editarData(c) {
  c = c || { tipo: 'Comemorativa', regiao: 'Global', regra: 'fixa:01-01' };
  const p = String(c.regra || 'fixa:01-01').split(':');
  const nome = inp({ value: c.nome || '' });
  const tipo = sel(TIPOS_CAL, c.tipo), regiao = sel(REGIOES, c.regiao);
  const ideia = inp({ value: c.ideia || '', placeholder: 'Ideia de tema para essa data' });
  const modo = sel([['fixa', 'Mesma data todo ano'], ['data', 'Data única'], ['pascoa', 'Relativa à Páscoa'], ['nth', 'Dia da semana do mês (ex.: 2º domingo de maio)'], ['sexta13', 'Toda sexta-feira 13']], p[0]);
  const dia = inp({ type: 'number', min: 1, max: 31, value: p[0] === 'fixa' ? Number(p[1].split('-')[1]) : 1 });
  const mesOpts = MESES_L.map((m, i) => [String(i + 1), m]);
  const mes = sel(mesOpts, p[0] === 'fixa' ? String(Number(p[1].split('-')[0])) : p[0] === 'nth' ? String(Number(p[1])) : '1');
  const dataU = inp({ type: 'date', value: p[0] === 'data' ? p[1] : '' });
  const offset = inp({ type: 'number', value: p[0] === 'pascoa' ? Number(p[1]) : 0 });
  const dsem = sel(DIAS_L.map((d, i) => [String(i), d]), p[0] === 'nth' ? p[2] : '0');
  const nth = sel([['1', '1º'], ['2', '2º'], ['3', '3º'], ['4', '4º'], ['-1', 'último']], p[0] === 'nth' ? p[3] : '1');
  const det = h('div', { class: 'row full' });
  function desenharModo() {
    det.innerHTML = '';
    const v = modo.value;
    if (v === 'fixa') add(det, [campo('Dia', dia), campo('Mês', mes)]);
    if (v === 'data') add(det, [campo('Data', dataU)]);
    if (v === 'pascoa') add(det, [campo('Dias em relação à Páscoa', offset, { hint: 'Ex.: Carnaval (sábado) = -50, Sexta Santa = -2' })]);
    if (v === 'nth') add(det, [campo('Qual', nth), campo('Dia da semana', dsem), campo('Mês', mes)]);
  }
  modo.addEventListener('change', desenharModo); desenharModo();
  const regra = () => {
    const v = modo.value, p2 = (n) => String(n).padStart(2, '0');
    if (v === 'fixa') return `fixa:${p2(mes.value)}-${p2(dia.value)}`;
    if (v === 'data') return dataU.value ? 'data:' + dataU.value : '';
    if (v === 'pascoa') return 'pascoa:' + (Number(offset.value) || 0);
    if (v === 'nth') return `nth:${p2(mes.value)}:${dsem.value}:${nth.value}`;
    return 'sexta13';
  };
  const m = modal({
    titulo: c.id ? 'Editar data' : 'Nova data temática',
    corpo: h('div', { class: 'form' }, campo('Nome', nome, { full: true }), campo('Tipo', tipo), campo('Região', regiao),
      campo('Como repete', modo, { full: true }), det, campo('Ideia de tema', ideia, { full: true })),
    acoes: [c.id ? btn('Excluir', async () => { if (await excluir('calendario', c.id, c.nome)) { m.fechar(); S.sug = null; render(); } }, 'ghost danger') : null,
      h('span', { class: 'grow' }), btn('Cancelar', () => m.fechar(), 'ghost'),
      btn('Salvar', async () => {
        if (!nome.value.trim() || !regra()) { toast('Preencha nome e data', 'err'); return; }
        await salvar('calendario', { id: c.id, nome: nome.value.trim(), tipo: tipo.value, regiao: regiao.value, ideia: ideia.value.trim(), regra: regra() });
        S.sug = null; m.fechar(); render();
      }, 'primary')]
  });
}

function mapasBuscar() {
  const r = S.rota;

  if (!S.busca || S.busca.chave !== JSON.stringify([r.texto, r.tags, r.festaId])) {
    S.busca = { chave: JSON.stringify([r.texto, r.tags, r.festaId]), texto: r.texto || '', tags: r.tags || [], cap: 30, balada: true, pagina: 1, resultados: null, aprovados: [], erros: [],
      motor: S.busca ? S.busca.motor : motorMapaSalvo() };
  }
  const B = S.busca;
  const nomeMotor = (MOTORES_MAPA.find((x) => x[0] === B.motor) || MOTORES_MAPA[0])[1];
  const motor = sel(MOTORES_MAPA, B.motor);
  motor.addEventListener('change', () => {
    B.motor = motor.value;
    try { localStorage.setItem('many_motor_mapa', B.motor); } catch (e) { }
    if (B.resultados !== null) buscar(); else render();
  });
  // escolher a festa já puxa o nome e as tags do tema dela
  const festasAbertas = festasOrdenadas().filter((f) => f.data >= S.hoje && !['Cancelada', 'Realizada'].includes(f.status));
  if (festa && !festasAbertas.includes(festa)) festasAbertas.unshift(festa);
  const festaSel = sel([['', '— nenhuma —']].concat(festasAbertas.map((f) => [f.id, `${f.nome} (${fmtDM(f.data)})`])), festa ? festa.id : '');
  festaSel.addEventListener('change', () => {
    const f = porId('festas', festaSel.value), t = f ? temaDe(f) : null;
    if (!f) { ir('mapas', { aba: 'buscar' }); return; }
    ir('mapas', { aba: 'buscar', festaId: f.id, texto: t ? t.nome : '', tags: t ? t.tags || [] : [] });
  });
  const texto = inp({ value: B.texto, placeholder: 'Ex.: halloween, praia, neon…' });
  const tags = tagBox(B.tags, 'tags (terror, praia…)');
  const cap = inp({ type: 'number', min: 0, value: B.cap, style: { width: '90px' } });
  const balada = h('input', { type: 'checkbox', checked: B.balada });
  const res = h('div', { class: 'stack' });

  async function buscar(mais) {
    B.texto = texto.value.trim(); B.tags = tags.valores(); B.cap = Number(cap.value) || 0; B.balada = balada.checked;
    B.pagina = mais ? B.pagina + 1 : 1; B.motor = motor.value;
    if (!mais) { B.resultados = null; desenhar(true); }
    try {
      const out = await api('buscarMapas', { motor: B.motor, texto: B.texto, tags: B.tags, capacidadeMin: B.cap, balada: B.balada, pagina: B.pagina });
      B.resultados = mais ? (B.resultados || []).concat(out.resultados.filter((x) => !(B.resultados || []).some((y) => y.worldId === x.worldId))) : out.resultados;
      B.aprovados = out.aprovados; B.erros = out.erros;

    desenhar();

    }
    if (carregando) { res.appendChild(h('div', { class: 'loading' }, h('span', { class: 'spin' }), `Procurando mapas PC + Quest no ${nomeMotor}…`)); return; }
    if (B.resultados === null) {
      res.appendChild(vazio('Busque mapas para a festa', 'Digite o tema e/ou tags. Só aparecem mapas que rodam em PC e Quest; conteúdo +18 fica de fora.'));
    } else if (!B.resultados.length && !B.erros.length) {
      res.appendChild(vazio('Nada encontrado', 'Tente outras palavras (em inglês costuma render mais: horror, beach, neon…).'));
    } else if (B.resultados.length) {
      res.appendChild(secao(`Sugestões do ${nomeMotor} (${B.resultados.length})`));

      h('a', { href: url('vrcmap.com/'), target: '_blank' }, 'vrcmap'), ' · ',

  }

  texto.addEventListener('keydown', (e) => { if (e.key === 'Enter') buscar(); });
  desenhar();
  return h('div', { class: 'stack' },
    festa ? h('div', { class: 'card', style: { borderColor: 'var(--a1)' } }, 'Buscando mapa para ', h('b', {}, festa.nome), '. ',
      h('a', { href: '#', onclick: (e) => { e.preventDefault(); ir('festa', { id: festa.id }); } }, 'voltar para a festa')) : null,
    h('div', { class: 'card' }, h('div', { class: 'form' },
      campo('Festa', festaSel, { hint: 'Puxa o nome e as tags do tema da festa.' }), campo('Buscar no', motor),
      campo('Tema / palavras', texto), campo('Tags', tags),
      h('label', { class: 'f' }, 'Capacidade mínima', cap),
      h('label', { class: 'f' }, 'Filtros', h('span', { class: 'row', style: { color: 'var(--text)' } }, balada, 'Incluir mapas de balada (club/DJ)')),
      h('div', { class: 'full row end' }, h('span', { class: 'hint grow' }, 'Sempre PC + Quest. Mapas reprovados no banco não aparecem.'), btn('Buscar', () => buscar(), 'primary', 'busca')))),
    res);
}

// ---------- Roteiros ----------
function roteiroDa(festaId) { return lista('roteiros').find((r) => r.festaId === festaId) || null; }
function palavras(txt) { return String(txt || '').trim().split(/\s+/).filter(Boolean).length; }
function segundosFala(n) { return Math.round(n / 2.5); }
function partesIncluidas(rot) { return (rot.partes || []).filter((p) => p.incluir !== false); }
function textoCorrido(rot) { return partesIncluidas(rot).map((p) => p.texto).join('\n\n'); }
function ajusteVal(k) {
  const r = lista('ajustes').find((x) => x.chave === k);
  return r && r.valor !== '' ? r.valor : S.consts.ajustesPadrao[k];
}

async function copiarTexto(txt) {
  // se o iframe não tiver permissão de área de transferência, cai no método antigo logo abaixo
  try { await navigator.clipboard.writeText(txt); toast('Roteiro copiado', 'ok'); return; } catch (e) { }
  const t = h('textarea', { style: { position: 'fixed', opacity: '0' } });
  t.value = txt; document.body.appendChild(t); t.select();
  const ok = document.execCommand('copy'); t.remove();
  toast(ok ? 'Roteiro copiado' : 'Não deu para copiar: selecione o texto no modo gravação', ok ? 'ok' : 'err');
}

VIEWS.roteiros = function () {
  const fs = festasOrdenadas();
  const prox = fs.filter((f) => f.data >= S.hoje && f.status !== 'Cancelada');
  const passadas = fs.filter((f) => f.data < S.hoje).reverse().slice(0, 10);
  const linha = (f) => {
    const r = roteiroDa(f.id);
    const total = r ? partesIncluidas(r).reduce((n, p) => n + palavras(p.texto), 0) : 0;
    return h('div', { class: 'li', style: { cursor: 'pointer' }, onclick: () => ir('festa', { id: f.id, aba: 'roteiro' }) },
      h('div', { style: { width: '58px', textAlign: 'center' } }, h('div', { style: { fontWeight: 800 } }, fmtDM(f.data)), h('div', { class: 'small faint' }, DIAS[dt(f.data).getUTCDay()])),
      h('div', { class: 't' }, h('div', {}, h('b', {}, f.nome)), h('div', { class: 's' }, r ? `${total} palavras · ~${segundosFala(total)}s de fala` : 'ainda sem roteiro')),
      r ? h('span', { class: 'chip st-' + (r.status === 'Gravado' ? 'Realizada' : r.status === 'Finalizado' ? 'Confirmada' : 'Ideia') }, r.status) : h('span', { class: 'chip' }, 'sem roteiro'),
      btn(r ? 'Abrir' : 'Criar', null, 'sm'));
  };
  return h('div', {},
    topo('Roteiros'),
    S.ia && !S.ia.configurada ? avisoIA() : null,
    secao('Próximas festas'),
    prox.length ? h('div', { class: 'card' }, h('div', { class: 'list' }, prox.map(linha))) : vazio('Nenhuma festa marcada', null, btn('Nova festa', () => novaFesta(), 'primary', 'plus')),
    passadas.length ? secao('Festas passadas') : null,
    passadas.length ? h('div', { class: 'card' }, h('div', { class: 'list' }, passadas.map(linha))) : null);
};

function avisoIA() {
  return h('div', { class: 'card', style: { borderColor: 'var(--warn)', marginBottom: '14px' } },
    h('b', {}, 'A IA ainda não está configurada. '), 'Para gerar roteiros, coloque a chave do Gemini em ',
    h('a', { href: '#', onclick: (e) => { e.preventDefault(); ir('equipe', { aba: 'ia' }); } }, 'Equipe e ajustes → IA e roteiros'), '.');
}

function festaRoteiro(f) {
  const rot = roteiroDa(f.id);
  if (!rot) return roteiroNovo(f);
  return roteiroEditor(f, rot);
}

function seletorDuracao(valor) {
  return sel([['30', '~30 segundos'], ['60', '~60 segundos'], ['90', '~90 segundos']], String(valor || 60));
}

function roteiroNovo(f) {
  const dur = seletorDuracao(60);
  const instr = area('', { placeholder: 'Opcional. Ex.: puxar mais para o lado engraçado; citar o sorteio logo no começo…', style: { minHeight: '64px' } });
  const ir_ = btn('Gerar roteiro', null, 'primary', 'ia');
  ir_.addEventListener('click', async () => {
    ir_.disabled = true; ir_.lastChild.textContent = 'Gerando… (uns 10 a 30 segundos)';
    try {
      const r = await run('gerarRoteiro', { festaId: f.id, duracao: Number(dur.value), instrucoes: instr.value.trim() });
      upsert('roteiros', r.salvo); toast('Roteiro gerado', 'ok'); render();
    } catch (e) { ir_.disabled = false; ir_.lastChild.textContent = 'Gerar roteiro'; }
  });
  const temAtiv = lista('atividades').some((a) => a.festaId === f.id);
  const partes = S.consts.partesRoteiro.filter((p) => p[0] !== 'atividades' || temAtiv);
  return h('div', { class: 'stack' },
    S.ia && !S.ia.configurada ? avisoIA() : null,
    h('div', { class: 'card' },
      h('h3', {}, 'Roteiro do vídeo de divulgação'),
      h('p', { class: 'small muted', style: { marginTop: 0 } }, 'A IA escreve o roteiro com os dados desta festa (data, horário BR e PT, tema, DJs, prêmios e atividades), separado nas partes abaixo. Depois você edita, pede novas versões de cada parte e marca como finalizado.'),
      h('ol', { class: 'small', style: { margin: '0 0 14px', paddingLeft: '20px', color: 'var(--muted)' } }, partes.map((p) => h('li', {}, h('b', { style: { color: 'var(--text)' } }, p[1]), ' — ', p[2]))),
      h('div', { class: 'form' }, campo('Duração do vídeo', dur), campo('Pedido extra para a IA', instr, { full: true })),
      h('div', { class: 'row end', style: { marginTop: '14px' } }, ir_)),
    h('div', { class: 'hint' }, 'Dica: quanto mais completo o cadastro da festa (tema com descrição, DJs, atividades), melhor o roteiro.'));
}

function roteiroEditor(f, rot) {
  // cópia local: as edições são salvas ao sair do campo
  const partes = (rot.partes || []).map((p) => Object.assign({}, p, { versoes: (p.versoes || []).slice() }));
  const totalEl = h('span', { class: 'small muted' });
  const atualizarTotal = () => {
    const n = partes.filter((p) => p.incluir !== false).reduce((s, p) => s + palavras(p.texto), 0);
    const alvo = rot.duracao || 60, seg = segundosFala(n);
    totalEl.textContent = `${n} palavras · ~${seg}s de fala (alvo ${alvo}s)`;
    totalEl.className = 'small ' + (seg > alvo * 1.2 ? 'soon' : 'muted');
  };
  atualizarTotal();
  let salvando = Promise.resolve();
  const salvarPartes = () => {
    salvando = salvando.then(() => run('salvarRoteiro', { id: rot.id, partes }).then((r) => { upsert('roteiros', r.salvo); }).catch(() => {}));
    return salvando;
  };
  const st = sel(S.consts.statusRoteiro, rot.status, { style: { width: 'auto' }, onchange: async () => {
    const r = await run('salvarRoteiro', { id: rot.id, status: st.value }); upsert('roteiros', r.salvo); toast('Status: ' + st.value, 'ok'); render();
  } });

  const cards = partes.map((p) => {
    const ta = area(p.texto, { style: { minHeight: '70px', fontSize: '16px', lineHeight: '1.5' } });
    const cont = h('span', { class: 'chip' }, `${palavras(p.texto)} palavras`);
    const autosize = () => { ta.style.height = 'auto'; ta.style.height = Math.max(70, ta.scrollHeight + 2) + 'px'; };
    ta.addEventListener('input', () => { p.texto = ta.value; cont.textContent = `${palavras(p.texto)} palavras`; atualizarTotal(); autosize(); });
    ta.addEventListener('change', salvarPartes);
    setTimeout(autosize, 0);
    const inc = h('input', { type: 'checkbox', checked: p.incluir !== false, title: 'Incluir no vídeo', onchange: () => { p.incluir = inc.checked; card.style.opacity = inc.checked ? '1' : '.5'; atualizarTotal(); salvarPartes(); } });
    const coment = inp({ placeholder: 'O que mudar? (opcional) Ex.: mais curto, cite o mapa, outra curiosidade…', style: { padding: '8px 10px', fontSize: '14px' } });
    const bNova = btn('Nova versão', null, 'sm', 'ia');
    const pedir = async () => {
      bNova.disabled = true; bNova.lastChild.textContent = 'Escrevendo…';
      try {
        await salvando;
        const r = await run('refazerParte', { roteiroId: rot.id, chave: p.chave, comentario: coment.value.trim(), partes });
        upsert('roteiros', r.salvo); render();
      } catch (e) { bNova.disabled = false; bNova.lastChild.textContent = 'Nova versão'; }
    };
    bNova.addEventListener('click', pedir);
    coment.addEventListener('keydown', (e) => { if (e.key === 'Enter') pedir(); });
    const versoesBox = h('div', { style: { display: 'none', marginTop: '10px' } });
    const bVersoes = p.versoes.length ? btn(`Versões anteriores (${p.versoes.length})`, () => { versoesBox.style.display = versoesBox.style.display === 'none' ? '' : 'none'; }, 'ghost sm') : null;
    p.versoes.forEach((v, i) => {
      versoesBox.appendChild(h('div', { class: 'li', style: { alignItems: 'flex-start' } },
        h('div', { class: 't' }, h('div', { class: 'small', style: { whiteSpace: 'pre-wrap' } }, v.texto),
          h('div', { class: 's' }, [v.comentario ? `pedido: "${v.comentario}"` : '', nomePessoa(v.por), fmtQuando(v.em)].filter(Boolean).join(' · '))),
        btn('Usar esta', () => {
          const atual = p.texto;
          p.texto = v.texto;
          p.versoes.splice(i, 1);
          if (atual) p.versoes.unshift({ texto: atual, comentario: 'trocada por versão anterior', em: new Date().toISOString(), por: S.me.email });
          salvarPartes().then(render);
        }, 'sm')));
    });
    const card = h('div', { class: 'card', style: { opacity: p.incluir !== false ? '1' : '.5' } },
      h('div', { class: 'row', style: { marginBottom: '10px' } }, inc, h('h3', { style: { margin: 0 } }, p.titulo), cont, h('span', { class: 'grow' }), bVersoes),
      ta,
      h('div', { class: 'row', style: { marginTop: '10px', flexWrap: 'nowrap' } }, h('div', { class: 'grow' }, coment), bNova),
      versoesBox);
    return card;
  });

  return h('div', { class: 'stack' },
    S.ia && !S.ia.configurada ? avisoIA() : null,
    h('div', { class: 'card' },
      h('div', { class: 'row' },
        h('div', { class: 'grow' }, h('div', { class: 'small muted' }, 'Status do roteiro'), st),
        h('div', { style: { textAlign: 'right' } }, totalEl)),
      h('div', { class: 'row', style: { marginTop: '14px' } },
        btn('Modo gravação', () => salvarPartes().then(() => modoGravacao(f, roteiroDa(f.id))), 'primary', 'play'),
        btn('Copiar texto', () => copiarTexto(textoCorrido({ partes })), '', 'copiar'),
        h('span', { class: 'grow' }),
        btn('Gerar tudo de novo', () => regerarTudo(f, rot), 'ghost', 'ia'))),
    h('div', { class: 'hint' }, 'Edite à vontade (salva ao sair do campo). Desmarque a caixa de uma parte para tirá-la do vídeo. Confira curiosidades do gancho antes de gravar.'),
    cards);
}

function regerarTudo(f, rot) {
  const dur = seletorDuracao(rot.duracao);
  const instr = area(rot.instrucoes, { placeholder: 'O que mudar no roteiro todo? Ex.: mais engraçado, menos formal…', style: { minHeight: '70px' } });
  const ok = btn('Gerar de novo', null, 'primary', 'ia');
  const m = modal({
    titulo: 'Gerar o roteiro todo de novo',
    corpo: h('div', { class: 'form' }, campo('Duração', dur), campo('Pedido para a IA', instr, { full: true }),
      h('div', { class: 'hint full' }, 'O texto atual de cada parte fica guardado em "Versões anteriores".')),
    acoes: [btn('Cancelar', () => m.fechar(), 'ghost'), ok]
  });
  ok.addEventListener('click', async () => {
    ok.disabled = true; ok.lastChild.textContent = 'Gerando…';
    try {
      const r = await run('gerarRoteiro', { festaId: f.id, duracao: Number(dur.value), instrucoes: instr.value.trim() });
      upsert('roteiros', r.salvo); m.fechar(); toast('Roteiro novo gerado', 'ok'); render();
    } catch (e) { ok.disabled = false; ok.lastChild.textContent = 'Gerar de novo'; }
  });
}

// Teleprompter: texto grande rolando sozinho, para gravar o vídeo
function modoGravacao(f, rot) {
  let tamanho = 40, velocidade = 30, rodando = false, ultimo = 0, timer = 0, resto = 0;
  const texto = h('div', { style: { maxWidth: '900px', margin: '0 auto', padding: '40vh 24px 70vh', lineHeight: '1.45', fontWeight: 600 } },
    partesIncluidas(rot).map((p) => h('div', { style: { marginBottom: '1.2em' } },
      h('div', { style: { fontSize: '14px', letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--a1)', fontWeight: 700, marginBottom: '.3em' } }, p.titulo),
      h('div', { style: { whiteSpace: 'pre-wrap' } }, p.texto))));
  const rolo = h('div', { style: { position: 'absolute', inset: '0', overflowY: 'auto' } }, texto);
  const aplicar = () => { texto.style.fontSize = tamanho + 'px'; };
  aplicar();
  const passo = () => {
    const t = Date.now();
    if (ultimo) {
      resto += (velocidade * (t - ultimo)) / 1000;
      const px = Math.floor(resto);
      if (px) { rolo.scrollTop += px; resto -= px; }
    }
    ultimo = t;
  };
  const bPlay = btn('Rolar', null, 'primary', 'play');
  bPlay.addEventListener('click', () => {
    rodando = !rodando; ultimo = 0;
    bPlay.lastChild.textContent = rodando ? 'Pausar' : 'Rolar';
    bPlay.firstChild.replaceWith(icon(rodando ? 'pausa' : 'play'));
    clearInterval(timer);
    if (rodando) timer = setInterval(passo, 30);
  });
  const info = h('span', { class: 'small muted' });
  const mostrar = () => { info.textContent = `letra ${tamanho} · velocidade ${velocidade}`; };
  mostrar();
  const fechar = () => { rodando = false; clearInterval(timer); ov.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = (e) => { if (e.key === 'Escape') fechar(); if (e.key === ' ') { e.preventDefault(); bPlay.click(); } };
  document.addEventListener('keydown', tecla);
  const barra = h('div', { class: 'row', style: { position: 'absolute', left: '0', right: '0', bottom: '0', padding: '12px 16px', background: 'rgba(9,10,19,.92)', borderTop: '1px solid var(--line)', justifyContent: 'center' } },
    bPlay,
    btn('Mais devagar', () => { velocidade = Math.max(5, velocidade - 5); mostrar(); }, 'sm'),
    btn('Mais rápido', () => { velocidade += 5; mostrar(); }, 'sm'),
    btn('A-', () => { tamanho = Math.max(22, tamanho - 4); aplicar(); mostrar(); }, 'sm'),
    btn('A+', () => { tamanho = Math.min(80, tamanho + 4); aplicar(); mostrar(); }, 'sm'),
    btn('Do começo', () => { rolo.scrollTop = 0; }, 'sm ghost'),
    info,
    rot.status !== 'Gravado' ? btn('Marcar como gravado', async () => {
      const r = await run('salvarRoteiro', { id: rot.id, status: 'Gravado' }); upsert('roteiros', r.salvo); toast('Roteiro marcado como gravado', 'ok'); fechar(); render();
    }, 'sm') : null,
    btn('Fechar', fechar, 'sm ghost', 'x'));
  const ov = h('div', { style: { position: 'fixed', inset: '0', zIndex: 70, background: '#000', color: '#fff' } }, rolo, barra);
  document.body.appendChild(ov);
}

// confere a fila de artes sem botão: no máximo a cada 2 min por festa (o render seguinte não dispara de novo)
const ultimaVerificacao = {};
function verificarSozinho(f) {
  if (ultimaVerificacao[f.id] && Date.now() - ultimaVerificacao[f.id] < 120000) return;
  ultimaVerificacao[f.id] = Date.now();
  sincronizar(f, 'auto').catch(() => { });
}
async function sincronizar(f, silencioso) {
  const r = silencioso === 'auto' ? await api('sincronizarArtes', { festaId: f.id }) : await run('sincronizarArtes', { festaId: f.id });
  r.artes.forEach((x) => upsert('artes', x));
  r.pedidos.forEach((x) => upsert('pedidosArte', x));
  (r.temas || []).forEach((x) => upsert('temas', x));
  (r.animacoes || []).forEach((x) => upsert('animacoes', x));
  (r.pedidosAnimacao || []).forEach((x) => upsert('pedidosAnimacao', x));
  const nv = (r.animacoes || []).length;
  const msg = [r.artes.length ? `${r.artes.length} arte(s) nova(s)` : '', nv ? `${nv} animação(ões) nova(s)` : ''].filter(Boolean).join(' e ');
  if (silencioso === 'auto') { if (msg) { toast(msg + ' em ' + f.nome, 'ok'); renderSeguro(); } return; }
  if (!silencioso) toast(msg || 'Ainda não chegou nada da fila', msg ? 'ok' : '');
  render();
}

function modalFotos(f, slot, tema) {

    corpo: h('div', { class: 'stack' }, h('div', { class: 'row' }, h('div', { class: 'grow' }, busca), btn('Buscar', () => buscar(), 'primary', 'busca')),

const PECAS_ANIMACAO = ['story', 'feed', 'djs'];
function faltasAnimacao(f) {
  const ok = artesDa(f.id).filter((x) => x.status === 'Aprovada' && PECAS_ANIMACAO.includes(x.peca));
  const faltas = [];
  if (!ok.some((x) => x.peca === 'story')) faltas.push('Story de anúncio');
  if (!ok.some((x) => x.peca === 'feed')) faltas.push('Post do feed');
  (f.djIds || []).map((id) => porId('djs', id)).filter(Boolean).forEach((d) => {
    if (!ok.some((x) => x.peca === 'djs' && x.nome === 'Story DJ ' + d.nome)) faltas.push('Story DJ ' + d.nome);
  });
  return faltas;
}
function linkBaixarDrive(id) { return url('drive.google.com/uc?export=download&id=' + id); }
