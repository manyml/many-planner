// ---------- tela Artes: visão geral das artes de todas as festas ----------
VIEWS.artes = function () {
  const filtro = S.rota.filtro || 'proximas';
  let fs = festasOrdenadas().filter((f) => f.status !== 'Cancelada');
  if (filtro === 'proximas') fs = fs.filter((f) => f.data >= S.hoje);
  else fs = fs.filter((f) => f.data < S.hoje).reverse();
  const naFila = lista('pedidosArte').filter((p) => p.status === 'Na fila').length + lista('pedidosAnimacao').filter((p) => p.status === 'Na fila').length;
  new Set(lista('pedidosArte').concat(lista('pedidosAnimacao')).filter((p) => p.status === 'Na fila').map((p) => p.festaId))
    .forEach((id) => { const f = porId('festas', id); if (f) verificarSozinho(f); });
  return h('div', {},
    topo('Artes'),
    naFila ? h('div', { class: 'hint', style: { marginBottom: '12px' } }, `${naFila} pedido(s) na fila. Quem tem o Claude Code roda /many-artes no PC; o app confere sozinho e as artes prontas aparecem aqui.`) : null,
    abas([['proximas', 'Próximas festas'], ['passadas', 'Passadas']], filtro, (k) => ir('artes', { filtro: k })),
    fs.length ? h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))' } }, fs.map(cardArtesFesta))
      : vazio('Nenhuma festa aqui', 'As artes de cada festa aparecem aqui assim que ela for criada.'));
};

function cardArtesFesta(f) {
  const A = arteDe(f), arts = artesDa(f.id), ped = pedidosDa(f.id)[0];
  const nomes = [...new Set(arts.map((a) => a.nome))];
  const apr = artesAprovadas(f.id);
  const anim = lista('pedidosAnimacao').filter((p) => p.festaId === f.id).sort((a, b) => b.versao - a.versao)[0];
  // miniaturas: a versão mais recente de cada peça (aprovadas primeiro)
  const recentes = nomes.map((n) => arts.filter((a) => a.nome === n).sort((a, b) => b.versao - a.versao)[0])
    .sort((a, b) => (b.status === 'Aprovada') - (a.status === 'Aprovada') || (a.ordem || 0) - (b.ordem || 0)).slice(0, 4);
  const etapa = !A.logo ? ['Falta o logo', 'st-Cancelada'] : !ped ? ['Pronta para pedir', 'st-Ideia'] : ped.status === 'Na fila' ? ['Na fila', 'st-Testando']
    : apr.completo ? ['Tudo aprovado', 'st-Realizada'] : ['Em aprovação', 'st-Planejando'];
  const logo = A.logo ? thumbDrive(A.logo.fileId, 'checker') : h('div', { class: 'thumb', style: { display: 'grid', placeItems: 'center', color: 'var(--faint)' } }, icon('imagem'));
  logo.style.width = '64px'; logo.style.height = '64px'; logo.style.aspectRatio = '1'; logo.style.flex = 'none';
  return h('div', { class: 'card click', onclick: () => ir('festa', { id: f.id, aba: 'artes' }) },
    h('div', { class: 'row', style: { gap: '12px', alignItems: 'center' } }, logo,
      h('div', { class: 'grow', style: { minWidth: 0 } }, h('h4', { style: { margin: 0 } }, f.nome),
        h('div', { class: 'small muted' }, fmtData(f.data)),
        h('div', { class: 'row', style: { marginTop: '6px' } }, h('span', { class: 'chip ' + etapa[1] }, etapa[0]),
          ped ? h('span', { class: 'chip' }, 'v' + ped.versao) : null))),
    recentes.length ? h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px', marginTop: '12px' } }, recentes.map((x) => {
      const th = thumbDrive(x.fileId, '', null);
      th.style.aspectRatio = '9 / 14'; th.style.backgroundSize = 'cover';
      if (x.status === 'Aprovada') th.appendChild(h('span', { class: 'lbl' }, icon('check')));
      return th;
    })) : null,
    h('div', { class: 'row small muted', style: { marginTop: '10px', gap: '14px' } },
      apr.tipos ? h('span', {}, `${apr.aprovados}/${apr.tipos} tipos de peça aprovados`) : h('span', {}, 'sem artes ainda'),
      anim ? h('span', {}, icon('play'), ' animações: ' + anim.status.toLowerCase()) : null));
}

function secaoGeradas(f, pedidos) {
  if (!pedidos.length) return h('div', {});
  const artes = artesDa(f.id);
  const aprovadas = artes.filter((x) => x.status === 'Aprovada');
  const bBaixar = btn(`Baixar aprovadas (${new Set(aprovadas.map((x) => x.nome)).size}) .zip`, null, 'sm primary', 'download');
  bBaixar.title = 'Só as artes aprovadas: a versão aprovada mais recente de cada peça, num arquivo só';
  bBaixar.addEventListener('click', async () => {
    const txt = bBaixar.lastChild.textContent;
    bBaixar.disabled = true; bBaixar.lastChild.textContent = 'Preparando o .zip…';
    try {
      const r = await run('baixarArtes', { festaId: f.id });
      window.location.href = r.url;
      toast(`Baixando ${r.n} artes aprovadas` + (r.versoes.length > 1 ? ` (versões ${r.versoes.join(', ')})` : ''), 'ok');
    } catch (e) { } finally { bBaixar.disabled = false; bBaixar.lastChild.textContent = txt; }
  });
  const wrap = h('div', { class: 'stack' }, secao('Pedidos e versões', aprovadas.length ? bBaixar : null));
  pedidos.forEach((p, i) => {
    const doPedido = artes.filter((x) => x.pedidoId === p.id).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const corpo = h('div', { style: { display: i === 0 ? '' : 'none', marginTop: '12px' } });
    if (p.status === 'Na fila') corpo.appendChild(h('div', { class: 'small muted' }, 'Aguardando o Claude Code gerar. Peças: ' + (p.pecas || []).map((k) => (S.artesConsts.pecas.find((x) => x[0] === k) || [k, k])[1]).join(', ')));
    if ((p.avisos || []).length) corpo.appendChild(h('div', { class: 'small soon', style: { marginBottom: '10px' } }, p.avisos.map((a) => h('div', {}, a))));
    if (doPedido.length) {
      // seleção para mudar o status de várias artes de uma vez
      const marcadas = new Set();
      const caixas = [];
      const bSalvar = btn('Salvar', null, 'sm primary');
      const todas = h('input', { type: 'checkbox' });
      const novoStatus = sel([['Aprovada', 'Aprovada'], ['Rascunho', 'Voltar para rascunho']], 'Aprovada', { style: { width: 'auto', padding: '6px 8px', fontSize: '13px' } });
      const atualizarBarra = () => {
        bSalvar.disabled = !marcadas.size;
        bSalvar.lastChild.textContent = marcadas.size ? `Salvar (${marcadas.size})` : 'Salvar';
        todas.checked = marcadas.size === doPedido.length;
      };
      todas.addEventListener('change', () => {
        caixas.forEach(([cb, id]) => { cb.checked = todas.checked; if (todas.checked) marcadas.add(id); else marcadas.delete(id); });
        atualizarBarra();
      });
      const aplicar = async (ids, status) => {
        const r = await run('avaliarArtesLote', { ids, status });
        r.salvos.forEach((x) => upsert('artes', x));
        toast(`${ids.length} arte(s): ${status === 'Aprovada' ? 'aprovadas' : 'de volta para rascunho'}`, 'ok'); render();
      };
      bSalvar.addEventListener('click', () => aplicar([...marcadas], novoStatus.value));
      const faltaAprovar = doPedido.filter((x) => x.status !== 'Aprovada');
      corpo.appendChild(h('div', { class: 'row', style: { marginBottom: '10px', gap: '10px' } },
        h('label', { class: 'row small', style: { gap: '6px', color: 'var(--text)' } }, todas, 'Selecionar todas'),
        h('span', { class: 'small muted' }, 'Marcadas →'), novoStatus, bSalvar, h('span', { class: 'grow' }),
        faltaAprovar.length ? btn(`Aprovar todas (${faltaAprovar.length})`, () => aplicar(faltaAprovar.map((x) => x.id), 'Aprovada'), 'sm', 'check') : null));
      atualizarBarra();
      corpo.appendChild(h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill, minmax(170px, 1fr))' } }, doPedido.map((x) => {
        const th = thumbDrive(x.fileId, '', x.nome);
        th.style.aspectRatio = 'auto'; th.style.height = '240px'; th.style.backgroundSize = 'contain';
        const cb = h('input', { type: 'checkbox', title: 'Selecionar', onchange: () => { if (cb.checked) marcadas.add(x.id); else marcadas.delete(x.id); atualizarBarra(); } });
        caixas.push([cb, x.id]);
        return h('div', { class: 'stack', style: { gap: '6px', position: 'relative' } },
          h('label', { style: { position: 'absolute', top: '8px', left: '8px', zIndex: 2, background: 'rgba(0,0,0,.6)', borderRadius: '8px', padding: '4px 6px', display: 'flex' } }, cb),
          h('a', { href: linkDrive(x.fileId), target: '_blank' }, th),
          h('div', { class: 'row' }, h('span', { class: 'chip st-' + (x.status === 'Aprovada' ? 'Realizada' : x.status === 'Ajuste' ? 'Cancelada' : 'Ideia') }, x.status)),
          x.comentario ? h('div', { class: 'small muted' }, '"' + x.comentario + '"') : null,
          h('div', { class: 'row' },
            x.status !== 'Aprovada' ? btn('Aprovar', async () => { const r = await run('avaliarArte', { id: x.id, status: 'Aprovada' }); upsert('artes', r.salvo); render(); }, 'sm') : null,
            btn('Ajuste', () => pedirAjusteArte(x), 'sm ghost')));
      })));
      const ajustes = doPedido.filter((x) => x.status === 'Ajuste');
      if (ajustes.length) corpo.appendChild(h('div', { class: 'row end', style: { marginTop: '10px' } },
        btn(`Mandar ${ajustes.length} ajuste(s) para a fila`, async () => {
          const r = await run('pedirAjustes', { festaId: f.id, versao: p.versao }); upsert('pedidosArte', r.salvo); toast('Ajustes na fila', 'ok'); render();
        }, 'primary', 'ia')));
    }
    const leg = p.legendas || {};
    if (leg.instagram || leg.discord) {
      corpo.appendChild(h('div', { class: 'grid cols2', style: { marginTop: '12px' } },
        [['instagram', 'Legenda do Instagram'], ['discord', 'Mensagem do Discord']].filter(([k]) => leg[k]).map(([k, t]) => h('div', { class: 'card', style: { background: 'var(--surface2)' } },
          h('div', { class: 'row' }, h('b', { class: 'grow' }, t), btn('Copiar', () => copiarTexto(leg[k]), 'sm', 'copiar')),
          h('div', { class: 'small', style: { whiteSpace: 'pre-wrap', marginTop: '8px' } }, leg[k])))));
    }
    wrap.appendChild(h('div', { class: 'card' },
      h('div', { class: 'row', style: { cursor: 'pointer' }, onclick: () => { corpo.style.display = corpo.style.display === 'none' ? '' : 'none'; } },
        h('b', {}, 'Versão ' + p.versao), h('span', { class: 'chip ' + (p.status === 'Pronto' ? 'st-Realizada' : 'st-Testando') }, p.status),
        (p.ajustes || []).length ? h('span', { class: 'chip' }, 'ajustes') : null,
        h('span', { class: 'grow' }), h('span', { class: 'small faint' }, `${fmtQuando(p.criadoEm)} · ${nomePessoa(p.criadoPor)}`)),
      corpo));
  });
  return wrap;
}

function pedirAjusteArte(x) {
  const c = area(x.comentario, { placeholder: 'O que mudar nesta peça?' });
  const m = modal({
    titulo: 'Pedir ajuste: ' + x.nome, corpo: h('div', { class: 'stack' }, c, h('div', { class: 'hint' }, 'Depois de marcar as peças, clique em "Mandar ajustes para a fila".')),
    acoes: [btn('Cancelar', () => m.fechar(), 'ghost'), btn('Marcar ajuste', async () => {
      if (!c.value.trim()) { toast('Escreva o que mudar', 'err'); return; }
      const r = await run('avaliarArte', { id: x.id, status: 'Ajuste', comentario: c.value.trim() }); upsert('artes', r.salvo); m.fechar(); render();
    }, 'primary')]
  });
}

// visual do tema nas artes (fonte da faixa de info, estilo, cores)
function editorVisualTema(t) {
  const v = Object.assign({ auto: true, fonteInfo: '', estiloInfo: 'limpo', acento: '#ffd36b', tinta: '#000000', tintaOpacidade: 0, brilho: '#ff64dc' }, t.visual || {});
  const F = S.artesConsts.fontes;
  const auto = h('input', { type: 'checkbox', checked: v.auto !== false });
  const fonte = sel([['', '— o Claude escolhe —']].concat(F.rua.map((x) => [x, 'Rua: ' + x])).concat(F.limpa.map((x) => [x, 'Limpa: ' + x])), v.fonteInfo || '');
  const estilo = sel([['limpo', 'Limpo (sombra)'], ['neon', 'Neon (brilho)']], v.estiloInfo);
  const acento = h('input', { type: 'color', class: 'in', value: v.acento });
  const tinta = h('input', { type: 'color', class: 'in', value: v.tinta });
  const brilho = h('input', { type: 'color', class: 'in', value: /^#/.test(v.brilho) ? v.brilho : '#ff64dc' });
  const op = h('input', { type: 'range', min: 0, max: 0.8, step: 0.05, value: v.tintaOpacidade || 0, style: { width: '140px' } });
  const amostra = h('div', { style: { padding: '18px', borderRadius: '12px', textAlign: 'center', border: '1px solid var(--line2)' } });
  const desenhar = () => {
    const fam = fonte.value || 'Poppins';
    const id = 'gf-' + fam.replace(/\W/g, '');
    if (!document.getElementById(id)) document.head.appendChild(h('link', { id, rel: 'stylesheet', href: url('fonts.googleapis.com/css2?family=' + fam.replace(/ /g, '+') + '&display=swap') }));
    const sombra = estilo.value === 'neon' ? `0 0 8px rgba(255,255,255,.6), 0 0 22px ${brilho.value}` : '0 3px 12px rgba(0,0,0,.6)';
    amostra.style.background = `linear-gradient(${tinta.value}${Math.round(Number(op.value) * 255).toString(16).padStart(2, '0')}, #0008), #222`;
    amostra.innerHTML = '';
    add(amostra, [h('div', { style: { fontFamily: `'${fam}'`, color: acento.value, fontSize: '22px', textShadow: sombra } }, 'COMEÇA ÀS'),
      h('div', { style: { fontFamily: `'${fam}'`, color: '#fff', fontSize: '34px', lineHeight: '1.1', textShadow: sombra } }, '21H BR  ·  18/07')]);
  };
  [fonte, estilo, acento, tinta, brilho, op].forEach((e) => e.addEventListener('input', desenhar));
  desenhar();
  const salvarV = async () => {
    const r = await run('salvarVisualTema', { temaId: t.id, visual: { auto: auto.checked, fonteInfo: fonte.value, estiloInfo: estilo.value, acento: acento.value, acentoRegras: acento.value, tinta: tinta.value, tintaOpacidade: Number(op.value), brilho: brilho.value } });
    upsert('temas', r.salvo); toast('Visual salvo', 'ok');
  };
  return h('div', { class: 'f full' }, h('span', { class: 'small muted' }, 'Visual nas artes'),
    h('div', { class: 'card', style: { background: 'var(--surface2)' } },
      h('label', { class: 'row small', style: { marginBottom: '10px' } }, auto, 'Deixar o Claude ajustar sozinho a cada pedido'),
      h('div', { class: 'form' }, campo('Fonte da faixa de info', fonte), campo('Estilo', estilo),
        h('div', { class: 'row' }, campo('Destaque', acento), campo('Brilho', brilho), campo('Tinta do fundo', tinta), campo('Força da tinta', op))),
      h('div', { style: { marginTop: '10px' } }, amostra),
      h('div', { class: 'row end', style: { marginTop: '10px' } }, btn('Salvar visual', salvarV, 'sm primary'))));
}

          if (await excluir('equipe', p.id, `${p.nome} (sai de todos os aparelhos na hora)`)) render();

    }))));

// ---------- Busca rápida (Ctrl+K) ----------
function semAcento(x) { return String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function resultadosBusca(q) {
  q = semAcento(q).trim();
  if (!q) return [];
  const bate = (...campos) => campos.some((c) => semAcento(Array.isArray(c) ? c.join(' ') : c).includes(q));
  const r = [];
  festasOrdenadas().slice().reverse().forEach((f) => { if (bate(f.nome, fmtDM(f.data), (temaDe(f) || {}).nome)) r.push({ tipo: 'Festa', ic: 'festas', titulo: f.nome, sub: fmtData(f.data) + ' · ' + f.status, abrir: () => ir('festa', { id: f.id }) }); });
  lista('djs').forEach((d) => { if (bate(d.nome, d.estilos, d.discord)) r.push({ tipo: 'DJ', ic: 'djs', titulo: d.nome, sub: (d.estilos || []).join(', '), abrir: () => ir('dj', { id: d.id }) }); });
  lista('temas').forEach((t) => { if (bate(t.nome, t.tags, t.descricao)) r.push({ tipo: 'Tema', ic: 'temas', titulo: t.nome, sub: (t.tags || []).slice(0, 4).join(', '), abrir: () => { ir('temas', { aba: 'banco' }); editarTema(t, () => render()); } }); });
  lista('mapas').forEach((m) => { if (bate(m.nome, m.autor, m.tags)) r.push({ tipo: 'Mapa', ic: 'mapas', titulo: m.nome, sub: (m.status || '') + (m.autor ? ' · por ' + m.autor : ''), abrir: () => irMapa(m) }); });
  return r.slice(0, 30);
}
function irMapa(m) {
  ir('mapas', { aba: 'banco', destaque: m.id });
  setTimeout(() => { const el = document.querySelector('[data-mapa="' + m.id + '"]'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 50);
}
function abrirBusca() {
  if (document.querySelector('.overlay .busca-res')) return;
  const q = inp({ placeholder: 'Festa, DJ, tema ou mapa…', autocomplete: 'off' });
  const res = h('div', { class: 'list busca-res' });
  let itens = [], atual = 0;
  const abrirItem = (i) => { const it = itens[i]; if (!it) return; m.fechar(); it.abrir(); };
  const desenhar = () => {
    itens = resultadosBusca(q.value);
    atual = Math.min(atual, Math.max(0, itens.length - 1));
    res.innerHTML = '';
    if (!q.value.trim()) { res.appendChild(h('div', { class: 'muted small' }, 'Digite para buscar. Enter abre o primeiro; as setas escolhem.')); return; }
    if (!itens.length) { res.appendChild(h('div', { class: 'muted small' }, 'Nada encontrado.')); return; }
    itens.forEach((it, i) => res.appendChild(h('div', { class: 'li click' + (i === atual ? ' sel' : ''), onclick: () => abrirItem(i) },
      h('span', { class: 'busca-ic' }, icon(it.ic)), h('div', { class: 't' }, h('div', {}, it.titulo), h('div', { class: 's' }, it.tipo + (it.sub ? ' · ' + it.sub : ''))))));
  };
  q.addEventListener('input', () => { atual = 0; desenhar(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); atual = Math.min(atual + 1, itens.length - 1); desenhar(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); atual = Math.max(atual - 1, 0); desenhar(); }
    if (e.key === 'Enter') { e.preventDefault(); abrirItem(atual); }
  });
  const m = modal({ titulo: 'Buscar', corpo: h('div', { class: 'stack' }, q, res) });
  desenhar();
  setTimeout(() => q.focus(), 20);
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K') && S.me) { e.preventDefault(); abrirBusca(); }
});

// ---------- Duplicar festa (DJs, atividades e escala; a data é escolhida na hora) ----------
function somarDias(iso, n) { return new Date(dt(iso).getTime() + n * 86400000).toISOString().slice(0, 10); }
function duplicarFesta(f) {
  const nome = inp({ value: f.nome });
  const data = inp({ type: 'date' });
  const horaI = inp({ type: 'time', value: f.horaBR || '' });
  const ativs = lista('atividades').filter((a) => a.festaId === f.id), esc = lista('escala').filter((e) => e.festaId === f.id);
  const m = modal({
    titulo: 'Duplicar festa',
    corpo: h('div', { class: 'stack' },
      h('div', { class: 'hint' }, `Vem junto: ${(f.djIds || []).length} DJ(s), ${ativs.length} atividade(s) e a escala (${esc.length} pessoa(s)). Tema e mapa ficam vazios, o status volta para Ideia e o checklist é criado pela data nova.`),
      campo('Nome', nome), h('div', { class: 'grid cols2' }, campoDataFesta(data), campo('Começa às (BR)', horaI))),
    acoes: [btn('Cancelar', () => m.fechar(), 'ghost'), btn('Duplicar', async () => {
      if (!nome.value.trim() || !data.value) { toast('Preencha nome e data', 'err'); return; }
      const dif = Math.round((dt(data.value) - dt(f.data)) / 86400000);
      const nova = await salvar('festas', { nome: nome.value.trim(), data: data.value, horaBR: horaI.value, temaId: '', status: 'Ideia', djIds: (f.djIds || []).slice() });
      for (const a of ativs) {
        await salvar('atividades', { festaId: nova.id, tipoId: a.tipoId, titulo: a.titulo, regras: a.regras, premios: a.premios,
          prazo: a.prazo ? somarDias(a.prazo, dif) : '', canal: a.canal, paginas: a.paginas });
      }
      for (const e of esc) await salvar('escala', { festaId: nova.id, funcaoId: e.funcaoId, pessoa: e.pessoa, obs: e.obs });
      m.fechar(); toast('Festa duplicada', 'ok'); ir('festa', { id: nova.id });
    }, 'primary')]
  });
}

// ---------- Calendário das festas (festas + prazos de tarefas) ----------
function modoFestasSalvo() { try { return localStorage.getItem('mp_modo_festas') || 'lista'; } catch (e) { return 'lista'; } }
function calendarioFestas() {
  const mes = S.rota.mes || S.hoje.slice(0, 7);
  const [y, mo] = mes.split('-').map(Number);
  const mudarMes = (d) => { const x = new Date(Date.UTC(y, mo - 1 + d, 1)); ir('festas', Object.assign({}, S.rota, { mes: x.toISOString().slice(0, 7), dia: null })); };
  const iso = (d) => new Date(Date.UTC(y, mo - 1, d)).toISOString().slice(0, 10);
  const primeiro = new Date(Date.UTC(y, mo - 1, 1)).getUTCDay(), nDias = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const festas = lista('festas').filter((f) => f.data && f.data.startsWith(mes));
  const ativas = new Set(lista('festas').filter((f) => f.status !== 'Cancelada').map((f) => f.id));
  const tarefas = tarefasTodas().filter((t) => !t.feita && t.prazo && t.prazo.startsWith(mes) && ativas.has(t.festaId));
  const doDia = (k) => festas.filter((f) => f.data === k).map((f) => ({ festa: f }))
    .concat(tarefas.filter((t) => t.prazo === k).map((t) => ({ tarefa: t })));
  const item = (x) => x.festa
    ? h('div', { class: 'cal-item festa st-' + x.festa.status, title: x.festa.nome + ' (' + x.festa.status + ')', onclick: (e) => { e.stopPropagation(); ir('festa', { id: x.festa.id }); } }, x.festa.nome)
    : h('div', { class: 'cal-item tarefa' + (x.tarefa.prazo < S.hoje ? ' late' : ''), title: x.tarefa.titulo, onclick: (e) => { e.stopPropagation(); ir('festa', { id: x.tarefa.festaId, aba: 'checklist' }); } }, x.tarefa.titulo);
  const grade = h('div', { class: 'cal' }, DIAS.map((d) => h('div', { class: 'cal-dow' }, d)));
  for (let i = 0; i < primeiro; i++) grade.appendChild(h('div', { class: 'cal-dia vazio' }));
  for (let d = 1; d <= nDias; d++) {
    const k = iso(d), its = doDia(k);
    const temFesta = its.some((x) => x.festa), temTarefa = its.some((x) => x.tarefa), atrasada = its.some((x) => x.tarefa && x.tarefa.prazo < S.hoje);
    grade.appendChild(h('div', { class: 'cal-dia' + (k === S.hoje ? ' hoje' : '') + (k === S.rota.dia ? ' sel' : ''), onclick: () => ir('festas', Object.assign({}, S.rota, { dia: k })) },
      h('div', { class: 'cal-num' }, d),
      h('div', { class: 'cal-itens' }, its.slice(0, 3).map(item), its.length > 3 ? h('div', { class: 'cal-mais' }, '+' + (its.length - 3)) : null),
      its.length ? h('div', { class: 'cal-pontos' }, temFesta ? h('i', { class: 'p-festa' }) : null, temTarefa ? h('i', { class: atrasada ? 'p-late' : 'p-tarefa' }) : null) : null));
  }
  const diaSel = S.rota.dia && S.rota.dia.startsWith(mes) ? S.rota.dia : null;
  let detalhe = null;
  if (diaSel) {
    const its = doDia(diaSel);
    detalhe = h('div', { class: 'card', style: { marginTop: '12px' } }, h('h3', { style: { marginTop: 0 } }, fmtDataLonga(diaSel)),
      its.length ? h('div', { class: 'list' }, its.map((x) => x.festa
        ? h('div', { class: 'li click', onclick: () => ir('festa', { id: x.festa.id }) }, h('span', { class: 'busca-ic' }, icon('festas')), h('div', { class: 't' }, h('b', {}, x.festa.nome), h('div', { class: 's' }, x.festa.status)))
        : linhaTarefa(x.tarefa, true))) : h('div', { class: 'muted' }, 'Nada neste dia.'));
  }
  return h('div', {},
    h('div', { class: 'row cal-topo' },
      h('button', { class: 'btn ghost sm', onclick: () => mudarMes(-1), 'aria-label': 'Mês anterior' }, icon('voltar')),
      h('h3', { class: 'cal-mes' }, MESES_L[mo - 1] + ' de ' + y),
      h('button', { class: 'btn ghost sm', onclick: () => mudarMes(1), 'aria-label': 'Próximo mês' }, h('span', { class: 'virar' }, icon('voltar'))),
      mes !== S.hoje.slice(0, 7) ? btn('Hoje', () => ir('festas', Object.assign({}, S.rota, { mes: null, dia: null })), 'sm') : null,
      h('span', { class: 'grow' }),
      h('span', { class: 'small muted row cal-leg' }, h('span', {}, h('i', { class: 'p-festa' }), ' festa'), h('span', {}, h('i', { class: 'p-tarefa' }), ' prazo'), h('span', {}, h('i', { class: 'p-late' }), ' atrasada'))),
    grade, detalhe);
}

// ---------- Atualização automática (ao voltar para a aba e a cada 5 min com ela aberta) ----------
let ultimaCarga = Date.now(), carregando = false;
async function atualizarDados() {
  if (carregando || !S.me || salvandoN || !sessao()) return;
  carregando = true; ultimaCarga = Date.now();
  opsDesdeCarga = [];
  try {
    const b = await api('bootstrap');
    const antes = JSON.stringify(S.dados);
    Object.assign(S, { me: b.me, dados: b.dados, hoje: b.hoje, consts: b.consts, links: b.links, ia: b.ia, artesConsts: b.artesConsts });
    opsDesdeCarga.forEach(([t, o]) => upsert(t, o));
    guardarDadosDepois();
    if (JSON.stringify(S.dados) !== antes && !document.querySelector('.overlay')) renderSeguro();
    agendarPreCarga();
  } catch (e) { } finally { opsDesdeCarga = null; carregando = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - ultimaCarga > 30000) atualizarDados(); });
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - ultimaCarga > 290000) atualizarDados(); }, 60000);

// ---------- Lixeira e histórico ----------
// lista vinda do servidor: mostra na hora a última resposta guardada e troca quando a nova chegar
const respostasCache = {};
function listaRemota(chave, acao, args, desenhar) {
  const box = h('div', { class: 'card' }, h('div', { class: 'loading' }, h('span', { class: 'spin' }), 'Carregando…'));
  const mostrar = (r) => { box.innerHTML = ''; desenhar(box, r); };
  if (respostasCache[chave]) mostrar(respostasCache[chave]);
  api(acao, args).then((r) => { respostasCache[chave] = r; mostrar(r); })
    .catch((e) => { if (!respostasCache[chave]) { box.innerHTML = ''; box.appendChild(h('div', { class: 'muted' }, e.erro || 'Erro')); } });
  return box;
}

  const box = listaRemota('lixeira', 'lixeira', {}, (box, itens) => {
    if (!itens.length) { box.appendChild(h('div', { class: 'muted' }, 'A lixeira está vazia.')); return; }

      h('span', { class: 'chip' }, TABELAS_NOME[it.tabela] || it.tabelaTitulo),

      btn('Restaurar', async () => {
        const r = await run('restaurar', { tabela: it.tabela, id: it.id }); upsert(it.tabela, r.salvo); guardarDadosDepois(); delete respostasCache.lixeira; toast('Restaurado', 'ok'); render();
      }, 'sm', 'restaurar')))));
  });
  return h('div', {}, topo('Lixeira'), h('div', { class: 'hint', style: { marginBottom: '12px' } }, 'Nada é apagado de verdade: tudo que foi excluído pode voltar daqui.'), box);

  if (S.me) { toast('Erro: ' + ev.message, 'err'); return; }
  splash(h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } }, h('h2', { style: { margin: 0 } }, 'Erro ao carregar'),
    h('p', { class: 'muted small' }, `${ev.message} (${ev.lineno}:${ev.colno})`), btn('Tentar de novo', () => location.reload(), 'primary')));
});

function comPrazo(promessa, ms) {
  return Promise.race([promessa, new Promise((_, rej) => setTimeout(() => rej({ erro: 'O Google demorou demais para responder. Tente recarregar a página.' }), ms))]);
}

async function sairDoApp() {
  if (!(await confirmar('Sair do Many Planner neste aparelho?', 'Sair'))) return;
  try { await api('sair'); } catch (e) { }
  guardarSessao(null);
  try { localStorage.removeItem(DADOS_CHAVE); } catch (e) { }
  telaLogin();
}

// Entrada: e-mail da equipe + código de 6 dígitos enviado por e-mail
function telaLogin(aviso) {
  const email = inp({ type: 'email', placeholder: 'seu e-mail', autocomplete: 'email', value: (sessao() || {}).email || '' });
  const codigo = inp({ inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '000000', style: { fontSize: '26px', letterSpacing: '.4em', textAlign: 'center' } });
  const msg = h('div', { class: 'small muted' }, aviso || 'Entre com o e-mail que a equipe cadastrou no Many Planner.');
  const passo1 = h('div', { class: 'stack', style: { width: '100%' } });
  const passo2 = h('div', { class: 'stack', style: { width: '100%', display: 'none' } });
  const bEnviar = btn('Receber código', null, 'primary');
  const bEntrar = btn('Entrar', null, 'primary');
  const enviar = async () => {
    if (!email.value.trim()) return;
    bEnviar.disabled = true; bEnviar.textContent = 'Enviando…';
    try {
      const r = await api('pedirCodigo', { email: email.value.trim() });
      passo1.style.display = 'none'; passo2.style.display = '';
      msg.textContent = `Se ${email.value.trim()} estiver na equipe, um código de 6 dígitos chegou na caixa de entrada (confira o spam). Ele vale ${r.minutos} minutos.`;
      setTimeout(() => codigo.focus(), 30);
    } catch (e) { msg.textContent = e.erro || 'Não deu para enviar'; }
    bEnviar.disabled = false; bEnviar.textContent = 'Receber código';
  };
  const entrar = async () => {
    if (codigo.value.replace(/\D/g, '').length !== 6) { msg.textContent = 'O código tem 6 números.'; return; }
    bEntrar.disabled = true; bEntrar.textContent = 'Entrando…';
    try {
      const r = await api('entrarComCodigo', { email: email.value.trim(), codigo: codigo.value, aparelho: navigator.userAgent });
      guardarSessao({ token: r.token, email: r.email });
      iniciar();
    } catch (e) { msg.textContent = e.erro || 'Não deu para entrar'; bEntrar.disabled = false; bEntrar.textContent = 'Entrar'; }
  };
  bEnviar.addEventListener('click', enviar);
  bEntrar.addEventListener('click', entrar);
  email.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviar(); });
  codigo.addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  codigo.addEventListener('input', () => { if (codigo.value.replace(/\D/g, '').length === 6) entrar(); });
  add(passo1, [email, bEnviar]);
  add(passo2, [codigo, bEntrar, h('a', { href: '#', class: 'small', onclick: (e) => { e.preventDefault(); passo2.style.display = 'none'; passo1.style.display = ''; msg.textContent = 'Confira o e-mail e peça outro código.'; } }, 'Usar outro e-mail / pedir outro código')]);
  splash(h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center', width: 'min(360px, 100%)' } },
    h('h2', { style: { margin: 0 } }, 'Entrar'), msg, passo1, passo2));
  setTimeout(() => email.focus(), 30);
}

async function iniciar() {
  // com dados da última visita a tela abre na hora; a versão nova do servidor chega por trás e redesenha
  const guardado = window.MP_ROTA_INICIAL ? null : dadosGuardados();
  if (guardado) {
    Object.assign(S, { me: guardado.me, dados: guardado.dados, hoje: guardado.hoje, consts: guardado.consts, links: guardado.links, ia: guardado.ia, artesConsts: guardado.artesConsts });
    render();
  } else splash(h('div', { class: 'loading' }, 'Carregando o Many Planner…'), true);
  opsDesdeCarga = [];
  try {
    const b = await comPrazo(api('bootstrap'), 45000);
    Object.assign(S, { me: b.me, dados: b.dados, hoje: b.hoje, consts: b.consts, links: b.links, ia: b.ia, artesConsts: b.artesConsts });
    opsDesdeCarga.forEach(([t, o]) => upsert(t, o));
    opsDesdeCarga = null;
    guardarDadosDepois();
    // só no preview local
    if (window.MP_ROTA_INICIAL) S.rota = window.MP_ROTA_INICIAL(S);
    if (guardado) renderSeguro(); else render();
    agendarPreCarga();
  } catch (e) {
    opsDesdeCarga = null;
    if (guardado && !e.semSessao) { toast('Sem conexão com o servidor: mostrando os dados da última visita', 'err'); return; }
    if (e.semSessao) { guardarSessao(null); telaLogin(); return; }
    if (e.precisaConfigurar) {
      splash(h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } },
        h('h2', { style: { margin: 0 } }, 'Primeira configuração'),
        h('p', { class: 'muted' }, 'Isso cria a planilha "Many Planner — Dados" e a pasta "Many Planner" no Drive desta conta, com o calendário temático, o checklist padrão e as funções iniciais. Faça isso logado na conta Google do Many.'),
        btn('Configurar agora', async (ev) => { ev.target.disabled = true; ev.target.textContent = 'Configurando… (pode levar 1 min)'; try { await run('configurar'); iniciar(); } catch (e) { ev.target.disabled = false; ev.target.textContent = 'Configurar agora'; } }, 'primary')));
    } else {
      splash(h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } }, h('h2', { style: { margin: 0 } }, 'Não foi possível abrir'), h('p', { class: 'muted' }, e.erro || ''), btn('Tentar de novo', iniciar, 'primary')));
    }
  }
}

iniciar();
})();
</script>
